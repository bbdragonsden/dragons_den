<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plataforma — Dragons Den Academy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F409;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:             #080808;
            --bg-2:           #0a0a0a;
            --bg-3:           #0f0f0f;
            --bg-4:           #141414;
            --bg-5:           #1a1a1a;
            --gold:           #c8a96e;
            --gold-dim:       #a08050;
            --gold-light:     rgba(200,169,110,0.10);
            --gold-border:    rgba(200,169,110,0.20);
            --gold-glow:      rgba(200,169,110,0.06);
            --text:           #f0ede8;
            --text-secondary: #a09890;
            --text-muted:     #5a5550;
            --border:         rgba(255,255,255,0.055);
            --border-strong:  rgba(255,255,255,0.10);
            --red-dim:        rgba(255,80,80,0.08);
            --red-border:     rgba(255,80,80,0.22);
            --green-dim:      rgba(74,222,128,0.08);
            --green-border:   rgba(74,222,128,0.20);
            --sidebar-width:  240px;
            --header-h:       56px;
            --radius:         2px;
        }

        /* ─────────────────────────────────────────
           BASE
        ───────────────────────────────────────── */
        html { scroll-behavior: smooth; overflow-x: hidden; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Satoshi', system-ui, sans-serif;
            min-height: 100dvh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─────────────────────────────────────────
           SCROLLBAR
        ───────────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

        /* ─────────────────────────────────────────
           LOADING SCREEN
        ───────────────────────────────────────── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 9999;
        }

        #loading-screen::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            letter-spacing: 8px;
            color: var(--gold);
            animation: loadPulse 1.6s ease-in-out infinite;
        }

        .loading-bar {
            width: 80px;
            height: 1px;
            background: var(--border-strong);
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            inset-block: 0;
            left: -40px;
            width: 40px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: loadSweep 1.6s ease-in-out infinite;
        }

        @keyframes loadPulse {
            0%, 100% { opacity: 0.25; }
            50%       { opacity: 0.85; }
        }

        @keyframes loadSweep {
            0%   { left: -40px; }
            100% { left: 120px; }
        }

        /* ─────────────────────────────────────────
           APP SHELL
        ───────────────────────────────────────── */
        #app { display: none; min-height: 100dvh; }

        .platform-layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            min-height: 100dvh;
        }

        /* ─────────────────────────────────────────
           SIDEBAR
        ───────────────────────────────────────── */
        .sidebar {
            background: var(--bg-2);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* Sidebar header */
        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 6px;
        }

        .sidebar-brand-icon {
            flex-shrink: 0;
            opacity: 0.9;
        }

        .sidebar-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15px;
            letter-spacing: 4px;
            color: var(--gold);
            line-height: 1;
        }

        .sidebar-tagline {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding-left: 30px;
        }

        /* Sidebar nav */
        .sidebar-nav {
            flex: 1;
            padding: 12px 0 8px;
            overflow-y: auto;
        }

        .sidebar-section-label {
            font-size: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 16px 20px 6px;
            opacity: 0.6;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            font-size: 13px;
            font-family: 'Satoshi', sans-serif;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s cubic-bezier(0.16,1,0.3,1),
                        background 0.2s cubic-bezier(0.16,1,0.3,1);
            border: none;
            border-left: 2px solid transparent;
            background: none;
            width: 100%;
            text-align: left;
            position: relative;
        }

        .sidebar-item:hover {
            color: var(--text);
            background: rgba(255,255,255,0.03);
        }

        .sidebar-item.active {
            color: var(--gold);
            background: var(--gold-light);
            border-left-color: var(--gold);
        }

        .sidebar-item.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .sidebar-item.locked:hover {
            color: var(--text-muted);
            background: none;
        }

        .sidebar-item-icon {
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .sidebar-item:hover .sidebar-item-icon,
        .sidebar-item.active .sidebar-item-icon {
            opacity: 1;
        }

        .pack-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: inherit;
            opacity: 0.45;
            flex-shrink: 0;
            width: 20px;
        }

        .lock-icon {
            margin-left: auto;
            font-size: 9px;
            opacity: 0.35;
        }

        /* Sidebar divider */
        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        /* Sidebar footer */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-5);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar-initial {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: var(--gold);
            line-height: 1;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .btn-logout {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            padding: 5px 9px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            flex-shrink: 0;
            font-family: 'Satoshi', sans-serif;
        }

        .btn-logout:hover {
            color: #ff6b6b;
            border-color: rgba(255,107,107,0.28);
            background: rgba(255,80,80,0.05);
        }

        /* ─────────────────────────────────────────
           MAIN AREA
        ───────────────────────────────────────── */
        .main-area {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        /* ─────────────────────────────────────────
           TOP HEADER BAR (desktop)
        ───────────────────────────────────────── */
        .desktop-header {
            height: var(--header-h);
            border-bottom: 1px solid var(--border);
            background: rgba(8,8,8,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .desktop-header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold);
            opacity: 0.7;
        }

        .desktop-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 6px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: 100px;
        }

        .header-user-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-5);
            border: 1px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-user-initial {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 9px;
            color: var(--gold);
            line-height: 1;
        }

        .header-user-name {
            font-size: 11px;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
        }

        /* ─────────────────────────────────────────
           MOBILE TOPBAR
        ───────────────────────────────────────── */
        .mobile-topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .mobile-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--gold);
        }

        .mobile-menu-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
            transition: color 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 36px;
        }

        .mobile-menu-btn:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        .mobile-menu-btn .mmb-bar {
            transform-origin: center;
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1), opacity 0.2s;
        }

        .mobile-menu-btn[aria-expanded="true"] .mmb-bar-top {
            transform: translateY(4px) rotate(45deg);
        }
        .mobile-menu-btn[aria-expanded="true"] .mmb-bar-mid {
            opacity: 0;
            transform: scaleX(0);
        }
        .mobile-menu-btn[aria-expanded="true"] .mmb-bar-bot {
            transform: translateY(-4px) rotate(-45deg);
        }

        /* Mobile sidebar overlay */
        .sidebar-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 150;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* ─────────────────────────────────────────
           MAIN CONTENT
        ───────────────────────────────────────── */
        .main-content {
            flex: 1;
            padding: 40px 48px;
            max-width: 860px;
            width: 100%;
            animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            from { background-position: -400px 0; }
            to   { background-position: 400px 0; }
        }

        /* ─────────────────────────────────────────
           CONTENT HEADER
        ───────────────────────────────────────── */
        .content-header {
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .content-eyebrow {
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
            margin-bottom: 10px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .content-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 54px;
            line-height: 0.92;
            letter-spacing: 1px;
            color: var(--text);
            text-transform: uppercase;
        }

        .content-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.75;
            margin-top: 14px;
            max-width: 520px;
            letter-spacing: 0.1px;
        }

        /* ─────────────────────────────────────────
           WELCOME GRID
        ───────────────────────────────────────── */
        .welcome-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .welcome-pack-card {
            background: var(--bg-3);
            padding: 22px 20px 20px;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.16,1,0.3,1),
                        border-color 0.2s;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .welcome-pack-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--gold-glow) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .welcome-pack-card:hover {
            background: var(--bg-4);
            border-color: var(--gold-border);
        }

        .welcome-pack-card:hover::after { opacity: 1; }

        .welcome-pack-card:active { transform: scale(0.99); }

        .welcome-pack-card.locked-card {
            opacity: 0.28;
            cursor: not-allowed;
        }

        .welcome-pack-card.locked-card:hover {
            background: var(--bg-3);
            border-color: transparent;
        }

        .welcome-pack-card.locked-card:hover::after { opacity: 0; }

        .wpc-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .wpc-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--text);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wpc-count {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* ─────────────────────────────────────────
           VIDEO PLAYER
        ───────────────────────────────────────── */
        .video-player-wrap {
            background: #000;
            aspect-ratio: 16 / 9;
            margin-bottom: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .video-player-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .video-placeholder-icon {
            width: 52px;
            height: 52px;
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-3);
        }

        /* ─────────────────────────────────────────
           MODULE LIST
        ───────────────────────────────────────── */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
        }

        .module-item {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            background: var(--bg-3);
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.16,1,0.3,1),
                        border-color 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .module-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--gold);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .module-item:hover {
            background: var(--bg-4);
            border-color: var(--border);
        }

        .module-item:hover::before { opacity: 0.4; }

        .module-item.playing {
            background: var(--bg-4);
            border-color: var(--gold-border);
        }

        .module-item.playing::before { opacity: 1; }

        .module-item.playing .module-num { color: var(--gold); }

        .module-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--bg-5);
            line-height: 1;
            user-select: none;
        }

        .module-info {}

        .module-name {
            font-size: 13.5px;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.1px;
        }

        .module-meta {
            font-size: 10.5px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .module-duration {
            font-size: 10.5px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ─────────────────────────────────────────
           LOCKED PACK PANEL
        ───────────────────────────────────────── */
        .locked-panel {
            background: var(--bg-3);
            border: 1px solid var(--border);
            padding: 52px 44px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .locked-panel::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .locked-panel h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: var(--text);
            margin: 18px 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .locked-panel p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.75;
            max-width: 360px;
            margin: 0 auto 28px;
        }

        .btn-upgrade {
            display: inline-block;
            background: var(--gold);
            color: #000;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            padding: 13px 30px;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-upgrade:hover { opacity: 0.85; }
        .btn-upgrade:active { transform: scale(0.98); }

        /* ─────────────────────────────────────────
           ADMIN PANEL
        ───────────────────────────────────────── */
        .admin-search {
            background: var(--bg-3);
            border: 1px solid var(--border-strong);
            color: var(--text);
            font-family: 'Satoshi', sans-serif;
            font-size: 13px;
            padding: 10px 14px;
            outline: none;
            width: 300px;
            max-width: 100%;
            transition: border-color 0.2s;
        }

        .admin-search:focus {
            border-color: var(--gold-border);
        }

        .admin-search::placeholder { color: var(--text-muted); }

        .admin-refresh-btn {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 9px 14px;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .admin-refresh-btn:hover {
            color: var(--text);
            border-color: var(--border-strong);
            background: rgba(255,255,255,0.03);
        }

        /* User rows — NOTE: .user-row is used by BOTH the sidebar footer
           and the admin panel. The sidebar footer uses it as-is; the admin
           panel wraps it inside #admin-users-list. We keep a shared base
           and let context narrow the styles. */
        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* Admin-specific user row override (scoped to the list) */
        #admin-users-list .user-row {
            display: block;
            padding: 18px 20px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            margin-bottom: 1px;
            transition: border-color 0.2s;
        }

        #admin-users-list .user-row:hover {
            border-color: var(--border-strong);
        }

        .user-row-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .user-info-name {
            font-size: 13.5px;
            color: var(--text);
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        .user-info-email {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.2px;
        }

        .user-badges {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 7.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 7px;
            border: 1px solid;
            font-family: 'Satoshi', sans-serif;
            font-weight: 500;
        }

        .badge-ok      { color: #4ade80; border-color: rgba(74,222,128,0.20); background: rgba(74,222,128,0.05); }
        .badge-pending { color: var(--text-muted); border-color: var(--border); }
        .badge-admin   { color: var(--gold); border-color: var(--gold-border); background: var(--gold-light); }

        /* Pack tags */
        .user-packs-row {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-wrap: wrap;
            min-height: 28px;
        }

        .pack-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            padding: 4px 9px;
            border: 1px solid;
            transition: opacity 0.15s;
        }

        .pack-tag.valid {
            background: rgba(200,169,110,0.10);
            color: var(--gold);
            border-color: rgba(200,169,110,0.28);
        }

        .pack-tag.expiring {
            background: rgba(251,191,36,0.08);
            color: #d4a020;
            border-color: rgba(200,140,40,0.28);
        }

        .pack-tag.expired {
            background: rgba(80,80,80,0.08);
            color: #454545;
            border-color: rgba(80,80,80,0.18);
            text-decoration: line-through;
        }

        .pack-tag-name {
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 9.5px;
        }

        .pack-tag-expiry {
            opacity: 0.65;
            font-size: 9px;
        }

        .pack-revoke {
            background: none;
            border: none;
            cursor: pointer;
            color: inherit;
            opacity: 0.28;
            padding: 0 1px;
            font-size: 14px;
            line-height: 1;
            transition: opacity 0.2s;
        }

        .pack-revoke:hover { opacity: 1; }

        .no-packs-label {
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            opacity: 0.5;
        }

        /* Assign row */
        .assign-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .assign-select {
            background: var(--bg);
            border: 1px solid var(--border-strong);
            color: var(--text);
            font-family: 'Satoshi', sans-serif;
            font-size: 12px;
            padding: 8px 12px;
            outline: none;
            cursor: pointer;
            flex: 1;
            min-width: 160px;
            max-width: 220px;
            transition: border-color 0.2s;
        }

        .assign-select:focus { border-color: var(--gold-border); }

        .btn-assign {
            background: var(--gold);
            color: #000;
            border: none;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 2.5px;
            padding: 9px 18px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .btn-assign:hover  { opacity: 0.85; }
        .btn-assign:active { transform: scale(0.97); }

        .btn-assign:disabled {
            opacity: 0.28;
            cursor: not-allowed;
        }

        .assign-msg {
            font-size: 11.5px;
            font-family: 'Satoshi', sans-serif;
            padding: 5px 10px;
            white-space: nowrap;
            display: none;
            letter-spacing: 0.2px;
        }

        .assign-msg.ok {
            display: inline-block;
            color: #3ecf5d;
            background: var(--green-dim);
            border: 1px solid var(--green-border);
        }

        .assign-msg.err {
            display: inline-block;
            color: #e05555;
            background: var(--red-dim);
            border: 1px solid var(--red-border);
        }

        /* ─────────────────────────────────────────
           DECORATIVE GOLD LINE
        ───────────────────────────────────────── */
        .gold-rule {
            height: 1px;
            background: linear-gradient(90deg, var(--gold-border) 0%, transparent 100%);
            margin: 32px 0;
        }

        /* ─────────────────────────────────────────
           RESPONSIVE
        ───────────────────────────────────────── */
        @media (max-width: 768px) {
            .platform-layout {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.32s cubic-bezier(0.16,1,0.3,1);
                width: var(--sidebar-width);
            }

            .sidebar.open {
                transform: translateX(0);
                box-shadow: 8px 0 40px rgba(0,0,0,0.5);
            }

            .mobile-topbar  { display: flex; }
            .desktop-header { display: none; }

            .main-content {
                padding: 24px 18px;
                max-width: 100%;
            }

            .content-title { font-size: 38px; }

            .module-item {
                grid-template-columns: 36px 1fr auto;
                gap: 12px;
                padding: 14px 16px;
            }
        }

        @media (min-width: 769px) {
            .mobile-topbar { display: none !important; }
        }

        /* ─────────────────────────────────────────
           ALUMNOS UNIFIED VIEW
        ───────────────────────────────────────── */
        .alumno-list-item {
            border: 1px solid var(--border);
            background: var(--bg-2);
            padding: 14px 18px;
            margin-bottom: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: border-color 0.15s, background 0.15s;
        }
        .alumno-list-item:hover { border-color: var(--border-strong); background: var(--bg-3); }
        .alumno-list-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .alumno-list-email { font-size: 12px; color: var(--text-muted); }
        .alumno-source-tags { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; flex-shrink: 0; }
        .source-tag {
            font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase;
            padding: 2px 7px; border: 1px solid var(--border-strong); color: var(--text-muted);
        }
        .source-tag.campus   { border-color: rgba(200,169,110,0.4); color: var(--gold); }
        .source-tag.academia { border-color: rgba(100,160,255,0.35); color: #64a0ff; }
        .source-tag.plataforma { border-color: rgba(74,222,128,0.3); color: #4ade80; }
        .source-tag.seguimiento { border-color: rgba(255,180,100,0.3); color: #ffb464; }

        /* Detail view */
        .detail-back {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
            color: var(--text-muted); cursor: pointer; margin-bottom: 24px;
            background: none; border: none; padding: 0; font-family: 'Satoshi', sans-serif;
            transition: color 0.15s;
        }
        .detail-back:hover { color: var(--text); }
        .detail-profile-name { font-size: 26px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .detail-profile-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }
        .detail-section { border: 1px solid var(--border); margin-bottom: 10px; background: var(--bg-2); }
        .detail-section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-3);
            gap: 8px; flex-wrap: wrap;
        }
        .detail-section-title { font-size: 8px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); }
        .detail-section-body { padding: 16px; }
        .detail-field-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 7px; }
        .detail-field-label { font-size: 8px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); flex-shrink: 0; width: 110px; }
        .detail-field-val { font-size: 13px; color: var(--text-secondary); flex: 1; }
        .detail-empty { font-size: 12px; color: var(--text-muted); font-style: italic; margin-bottom: 10px; }
        .btn-create-seg {
            background: none; border: 1px solid var(--gold-border); color: var(--gold);
            font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
            padding: 6px 14px; cursor: pointer; font-family: 'Satoshi', sans-serif; transition: background 0.15s;
        }
        .btn-create-seg:hover { background: var(--gold-light); }
        .detail-hdr-actions { display: flex; gap: 6px; align-items: center; }

        /* Seguimiento modal extra */
        .seg-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 500px) { .seg-grid { grid-template-columns: 1fr; } }

        /* ─────────────────────────────────────────
           CAMPUS / ACADEMIA ADMIN VIEWS
        ───────────────────────────────────────── */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        @media (max-width: 600px) {
            .stats-row { grid-template-columns: 1fr 1fr; }
            .stats-row .stat-card:last-child { grid-column: span 2; }
        }

        .stat-card {
            background: var(--bg-3);
            border: 1px solid var(--border);
            padding: 16px 20px;
        }

        .stat-label {
            font-size: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 30px;
            letter-spacing: 1px;
            color: var(--gold);
            line-height: 1;
        }

        .stat-sub {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        .student-row {
            border: 1px solid var(--border);
            background: var(--bg-2);
            padding: 16px 20px;
            margin-bottom: 8px;
        }

        .student-row-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .student-name {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 2px;
        }

        .student-meta {
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .student-badges {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            align-items: center;
        }

        .status-badge {
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 3px 10px;
            white-space: nowrap;
        }

        .status-pendiente  { background: rgba(200,169,110,0.10); border: 1px solid rgba(200,169,110,0.30); color: var(--gold); }
        .status-confirmado { background: rgba(74,222,128,0.08);  border: 1px solid rgba(74,222,128,0.25);  color: #4ade80; }
        .status-cancelado  { background: rgba(255,80,80,0.08);   border: 1px solid rgba(255,80,80,0.22);   color: #ff5050; }
        .status-en_lista   { background: rgba(200,169,110,0.10); border: 1px solid rgba(200,169,110,0.30); color: var(--gold); }
        .status-convertido { background: rgba(74,222,128,0.08);  border: 1px solid rgba(74,222,128,0.25);  color: #4ade80; }
        .status-descartado { background: rgba(255,80,80,0.08);   border: 1px solid rgba(255,80,80,0.22);   color: #ff5050; }

        .precio-chip {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
        }

        .precio-chip strong {
            color: var(--text);
            font-size: 13px;
        }

        .student-detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 4px 16px;
            padding: 10px 0 8px;
            border-top: 1px solid var(--border);
            margin-top: 8px;
        }

        .student-detail-item {
            display: flex;
            gap: 6px;
            align-items: baseline;
        }

        .student-detail-label {
            font-size: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .student-detail-val {
            font-size: 12px;
            color: var(--text-secondary);
        }

        .notas-admin-display {
            font-size: 12px;
            color: var(--gold-dim);
            border-left: 2px solid var(--gold-border);
            padding-left: 10px;
            margin-top: 8px;
            line-height: 1.5;
        }

        .btn-edit-student {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 12px;
            cursor: pointer;
            transition: color 0.15s, border-color 0.15s;
            font-family: 'Satoshi', sans-serif;
        }

        .btn-edit-student:hover {
            color: var(--gold);
            border-color: var(--gold-border);
        }

        /* Edit modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: var(--bg-3);
            border: 1px solid var(--border-strong);
            padding: 28px 32px 24px;
            width: 100%;
            max-width: 440px;
        }

        .modal-title {
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 4px;
        }

        .modal-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 24px;
        }

        .modal-field { margin-bottom: 18px; }

        .modal-field label {
            display: block;
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .modal-select, .modal-textarea {
            width: 100%;
            background: var(--bg-5);
            border: 1px solid var(--border-strong);
            color: var(--text);
            font-family: 'Satoshi', sans-serif;
            font-size: 13px;
            padding: 9px 12px;
            outline: none;
            border-radius: 0;
        }

        .modal-select:focus, .modal-textarea:focus {
            border-color: var(--gold-dim);
        }

        .modal-textarea { resize: vertical; min-height: 80px; }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-modal-save {
            flex: 1;
            background: var(--gold);
            color: #080808;
            border: none;
            padding: 10px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 700;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
            transition: opacity 0.15s;
        }

        .btn-modal-save:hover { opacity: 0.85; }
        .btn-modal-save:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-modal-cancel {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            padding: 10px 20px;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
        }

        .modal-msg {
            font-size: 11px;
            margin-top: 10px;
            min-height: 16px;
        }

        .modal-msg.ok  { color: #4ade80; }
        .modal-msg.err { color: #ff5050; }

        /* ── PROFILE FORM ── */
        .profile-form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 620px; }
        .profile-form .full-width { grid-column: 1 / -1; }
        .profile-field { display: flex; flex-direction: column; gap: 6px; }
        .profile-field label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); }
        .profile-input { background: var(--bg-3); border: 1px solid var(--border-strong); color: var(--text); font-family: 'Satoshi', sans-serif; font-size: 13px; padding: 10px 12px; outline: none; transition: border-color 0.2s; width: 100%; }
        .profile-input:focus { border-color: var(--gold-border); }
        .profile-input::placeholder { color: var(--text-muted); }
        textarea.profile-input { resize: vertical; min-height: 80px; }
        .btn-save-profile { display: inline-block; background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; padding: 12px 28px; border: none; cursor: pointer; transition: opacity 0.2s, transform 0.15s; }
        .btn-save-profile:hover { opacity: 0.85; }
        .btn-save-profile:active { transform: scale(0.98); }
        .btn-save-profile:disabled { opacity: 0.4; cursor: not-allowed; }
        .profile-save-msg { font-size: 12px; margin-top: 4px; min-height: 16px; }
        .profile-save-msg.ok { color: #4ade80; }
        .profile-save-msg.err { color: #ff5050; }

        /* ── VIDEO CARDS ── */
        .video-card { background: var(--bg-3); border: 1px solid var(--border); padding: 16px 20px; margin-bottom: 10px; }
        .video-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
        .video-card-title { font-size: 14px; font-weight: 600; color: var(--text); }
        .video-card-url { font-size: 11px; color: var(--gold-dim); word-break: break-all; margin-bottom: 6px; }
        .video-card-url a { color: inherit; text-decoration: none; }
        .video-card-url a:hover { color: var(--gold); }
        .video-card-desc { font-size: 12px; color: var(--text-muted); line-height: 1.6; margin-bottom: 6px; }
        .video-card-meta { font-size: 10px; color: var(--text-muted); letter-spacing: 0.5px; }
        .video-status { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 8px; white-space: nowrap; flex-shrink: 0; }
        .video-status.pendiente   { background: rgba(200,169,110,0.12); color: var(--gold); }
        .video-status.en_revision { background: rgba(59,130,246,0.12);  color: #60a5fa; }
        .video-status.completado  { background: rgba(74,222,128,0.10);  color: #4ade80; }
        .video-notas { font-size: 12px; color: var(--text-secondary); background: var(--bg-4); border-left: 2px solid var(--gold-border); padding: 8px 12px; margin-top: 8px; line-height: 1.6; }
        .btn-submit-video { background: none; border: 1px solid var(--gold-border); color: var(--gold); font-family: 'Satoshi', sans-serif; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; padding: 10px 20px; cursor: pointer; transition: background 0.2s; }
        .btn-submit-video:hover { background: var(--gold-light); }

        /* ── MESSAGE THREAD ── */
        .msg-thread { display: flex; flex-direction: column; gap: 14px; max-width: 680px; margin-bottom: 24px; }
        .msg-bubble { padding: 12px 16px; max-width: 80%; line-height: 1.65; font-size: 13.5px; }
        .msg-bubble.user-msg { background: var(--bg-4); border: 1px solid var(--border); align-self: flex-end; color: var(--text); }
        .msg-bubble.admin-msg { background: rgba(200,169,110,0.07); border: 1px solid var(--gold-border); align-self: flex-start; color: var(--text); }
        .msg-meta { font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 5px; }
        .msg-compose { display: flex; flex-direction: column; gap: 10px; max-width: 680px; border-top: 1px solid var(--border); padding-top: 20px; }
        .msg-input { background: var(--bg-3); border: 1px solid var(--border-strong); color: var(--text); font-family: 'Satoshi', sans-serif; font-size: 13px; padding: 12px 14px; outline: none; resize: vertical; min-height: 80px; transition: border-color 0.2s; }
        .msg-input:focus { border-color: var(--gold-border); }
        .msg-input::placeholder { color: var(--text-muted); }
        .btn-send-msg { background: var(--gold); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 12px; letter-spacing: 3px; text-transform: uppercase; padding: 11px 26px; border: none; cursor: pointer; align-self: flex-start; transition: opacity 0.2s, transform 0.15s; }
        .btn-send-msg:hover { opacity: 0.85; }
        .btn-send-msg:active { transform: scale(0.98); }
        .btn-send-msg:disabled { opacity: 0.4; cursor: not-allowed; }
        .msg-empty { font-size: 13px; color: var(--text-muted); padding: 24px 0; }
        .unread-dot { width: 7px; height: 7px; background: var(--gold); border-radius: 50%; flex-shrink: 0; }

        @media (max-width: 600px) {
            .profile-form { grid-template-columns: 1fr; }
            .msg-bubble { max-width: 95%; }
        }
    </style>
</head>

<!-- Loading screen -->
<div id="loading-screen">
    <p class="loading-logo">Dragons Den</p>
    <div class="loading-bar"></div>
</div>

<!-- App (hidden until auth verified) -->
<div id="app">

    <!-- Mobile topbar -->
    <div class="mobile-topbar">
        <span class="mobile-logo">Dragons Den</span>
        <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Abrir men&uacute;" aria-expanded="false">
            <svg width="18" height="13" viewBox="0 0 18 13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line class="mmb-bar mmb-bar-top" x1="1" y1="1.5" x2="17" y2="1.5"/>
                <line class="mmb-bar mmb-bar-mid" x1="1" y1="6.5" x2="17" y2="6.5"/>
                <line class="mmb-bar mmb-bar-bot" x1="1" y1="11.5" x2="17" y2="11.5"/>
            </svg>
            <span class="mmb-label">Men&uacute;</span>
        </button>

// ── Auth ──────────────────────────────────────────────────────────────────
async function checkAuth() {
    // Handle OAuth/email confirmation code in URL
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
        await sb.auth.exchangeCodeForSession(code);
        window.history.replaceState({}, '', window.location.pathname);
    }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) return window.location.href = 'login.html';

    const user = session.user;
    const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email.split('@')[0];
    isAdmin = user.user_metadata?.is_admin === true;

    // Fetch pack permissions from DB
    const { data: packsData } = await sb.from('user_packs').select('pack_id');
    userPacks = packsData ? packsData.map(p => p.pack_id) : [];

    currentUser = { name, email: user.email };
    init();
}

function hasAccess(packId) {
    if (userPacks.includes('all') || userPacks.includes('completo')) return true;
    return userPacks.includes(packId);
}

    function closeMobileSidebar() {
        _sidebarEl.classList.remove('open');
        _overlayEl.classList.remove('active');
        _menuBtn.setAttribute('aria-expanded', 'false');
        document.body.style.overflow = '';
    }

    function openMobileSidebar() {
        _sidebarEl.classList.add('open');
        _overlayEl.classList.add('active');
        _menuBtn.setAttribute('aria-expanded', 'true');
        document.body.style.overflow = 'hidden';
    }

    _menuBtn.addEventListener('click', function() {
        _sidebarEl.classList.contains('open') ? closeMobileSidebar() : openMobileSidebar();
    });

    if (_overlayEl) {
        _overlayEl.addEventListener('click', closeMobileSidebar);
    }

    // Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeMobileSidebar();
    });

    // Swipe-left to close
    (function() {
        var swipeStartX = null;
        var swipeStartY = null;
        _sidebarEl.addEventListener('touchstart', function(e) {
            swipeStartX = e.touches[0].clientX;
            swipeStartY = e.touches[0].clientY;
        }, { passive: true });
        _sidebarEl.addEventListener('touchend', function(e) {
            if (swipeStartX === null) return;
            var dx = e.changedTouches[0].clientX - swipeStartX;
            var dy = e.changedTouches[0].clientY - swipeStartY;
            if (dx < -50 && Math.abs(dy) < Math.abs(dx)) {
                closeMobileSidebar();
            }
            swipeStartX = null;
            swipeStartY = null;
        }, { passive: true });
    })();
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
async function adminToken() {
    const { data: { session } } = await sb.auth.getSession();
    return session?.access_token;
}

async function fetchAdminData(refresh = false) {
    if (refresh) adminCache = null;
    if (adminCache) return adminCache;
    const token = await adminToken();
    const r = await fetch('/api/admin-data', { headers: { 'Authorization': `Bearer ${token}` } });
    if (!r.ok) throw new Error('Error al cargar datos');
    adminCache = await r.json();
    return adminCache;
}

// ── Pricing helpers ────────────────────────────────────────────────────────
function campusPrecio(entry) {
    const esNuevo = (entry.anterior || '').toLowerCase().includes('primera vez');
    const precioMes = esNuevo ? 40 : 35;
    const mesesStr = entry.meses || '';
    const numMeses = (mesesStr === 'Por confirmar' || !mesesStr)
        ? 0
        : mesesStr.split(',').map(m => m.trim()).filter(Boolean).length;
    return { precioMes, numMeses, total: precioMes * numMeses };
}

function academiaPrecio(interes) {
    return (interes || '').toLowerCase().includes('completo') ? 49 : 19;
}

function formatExpiry(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const diff = Math.round((d - Date.now()) / 86400000);
    if (diff < 0)   return `Expiró hace ${Math.abs(diff)}d`;
    if (diff === 0) return 'Expira hoy';
    if (diff === 1) return 'Mañana';
    if (diff <= 30) return `${diff} días`;
    return d.toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' });
}

function expiryStatus(dateStr) {
    if (!dateStr) return 'expired';
    const diff = Math.round((new Date(dateStr) - Date.now()) / 86400000);
    if (diff < 0)   return 'expired';
    if (diff <= 30) return 'expiring';
    return 'valid';
}

function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function buildUserList(users) {
    if (!users.length) return '<p style="color:var(--text-muted);font-size:13px;">Sin usuarios.</p>';
    return users.map(u => {
        const packTags = u.packs.length
            ? u.packs.map(p => `
                <span class="pack-tag ${expiryStatus(p.expires_at)}">
                    <span class="pack-tag-name">${esc(p.pack)}</span>
                    <span class="pack-tag-expiry">${formatExpiry(p.expires_at)}</span>
                    <button class="pack-revoke" onclick="revokePack('${esc(u.id)}','${esc(p.pack)}',this)" title="Revocar">&times;</button>
                </span>`).join('')
            : '<span class="no-packs-label">Sin acceso</span>';

        return `<div class="user-row" id="urow-${esc(u.id)}">
            <div class="user-row-top">
                <div>
                    <p class="user-info-name">${esc(u.name) || '—'}</p>
                    <p class="user-info-email">${esc(u.email)}</p>
                    <div class="user-badges">
                        <span class="badge ${u.confirmed ? 'badge-ok' : 'badge-pending'}">${u.confirmed ? 'Confirmado' : 'Sin confirmar'}</span>
                        ${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''}
                    </div>
                </div>
            </div>
            <div class="user-packs-row" id="ptags-${u.id}">${packTags}</div>
            <div class="assign-row">
                <select class="assign-select" id="sel-${esc(u.id)}">
                    <option value="">— Pack a asignar —</option>
                    <option value="tiro">Pack Tiro</option>
                    <option value="footwork">Pack Footwork</option>
                    <option value="defensa">Pack Defensa</option>
                    <option value="fisico">Pack Físico</option>
                    <option value="mental">Pack Mental</option>
                    <option value="completo">Pack Completo</option>
                    <option value="all">Acceso Total</option>
                </select>
                <button class="btn-assign" onclick="assignPack('${esc(u.id)}',this)">Asignar 1 año</button>
                <span class="assign-msg" id="msg-${esc(u.id)}"></span>
            </div>
        </div>`;
    }).join('');
}

function filterAdminUsers(q) {
    if (!adminCache) return;
    const lq = q.toLowerCase();
    const filtered = lq
        ? adminCache.users.filter(u => u.email.toLowerCase().includes(lq) || (u.name || '').toLowerCase().includes(lq))
        : adminCache.users;
    document.getElementById('admin-users-list').innerHTML = buildUserList(filtered);
}

function showMsg(userId, type, text) {
    const el = document.getElementById(`msg-${userId}`);
    if (!el) return;
    el.className = `assign-msg ${type}`;
    el.textContent = text;
    if (type === 'ok') setTimeout(() => { el.className = 'assign-msg'; el.textContent = ''; }, 4000);
}

async function assignPack(userId, btn) {
    const sel = document.getElementById(`sel-${userId}`);
    const pack = sel.value;
    if (!pack) return;
    btn.disabled = true;
    btn.textContent = '...';

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'assign', userId, pack })
    });
    const data = await r.json();
    btn.disabled = false;
    btn.textContent = 'Asignar 1 año';

    if (data.success) {
        showMsg(userId, 'ok', data.message || 'Pack asignado');
        adminCache = null;
        setTimeout(async () => {
            await renderAdmin();
            document.getElementById(`urow-${userId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 800);
    } else {
        showMsg(userId, 'err', data.error || 'Error al asignar');
    }
}

async function revokePack(userId, pack, btn) {
    btn.disabled = true;

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'revoke', userId, pack })
    });
    const data = await r.json();
    if (data.success) {
        showMsg(userId, 'ok', `Pack "${pack}" revocado`);
        adminCache = null;
        setTimeout(async () => { await renderAdmin(); }, 800);
    } else {
        btn.disabled = false;
        showMsg(userId, 'err', data.error || 'Error al revocar');
    }
}

function buildCampusList(entries) {

    return entries.map(e => {
        const p    = campusPrecio(e);

        const mesesArr = (e.meses || '').split(',').map(m => m.trim()).filter(Boolean);

        const detalles = [
            e.edad     ? { l: 'Edad',      v: e.edad + ' años' }     : null,

            ? `<span class="precio-chip">${p.numMeses} mes${p.numMeses > 1 ? 'es' : ''} &times; ${p.precioMes}&euro; = <strong>${p.total}&euro;</strong></span>`
            : `<span class="precio-chip">${p.precioMes}&euro;/mes</span>`;

        const fechaStr = e.created_at
            ? new Date(e.created_at).toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' })
            : '';

        return `<div class="student-row" id="crow-${esc(e.id)}">
            <div class="student-row-top">
                <div>
                    <p class="student-name">${esc(e.nombre)}</p>
                    <p class="student-meta">${esc(e.email)} &middot; ${fechaStr}</p>
                </div>

            ${detalleHTML ? `<div class="student-detail-grid">${detalleHTML}</div>` : ''}

function renderAcademiaPanel(entries) {

function buildWaitlistItems(entries) {

    return entries.map(e => {

            ? new Date(e.created_at).toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' })

            ? `<p class="notas-admin-display" style="margin-top:8px;">${esc(e.notas_admin)}</p>`

function filterAcademia(q) {

const ESTADOS_CAMPUS   = ['pendiente', 'confirmado', 'cancelado'];
const ESTADOS_WAITLIST = ['en_lista', 'convertido', 'descartado'];

function openEditModal(type, id, estado, notas, nombre) {
    document.getElementById('modal-record-id').value   = id;
    document.getElementById('modal-record-type').value = type;
    document.getElementById('modal-student-name').textContent = nombre;
    document.getElementById('modal-type-label').textContent =
        type === 'campus' ? 'Campus Verano' : 'Academia Online';
    document.getElementById('modal-notas').value = notas || '';
    document.getElementById('modal-msg').textContent = '';
    document.getElementById('modal-msg').className = 'modal-msg';

    const estadoSel = document.getElementById('modal-estado');
    const opciones = type === 'campus' ? ESTADOS_CAMPUS : ESTADOS_WAITLIST;
    estadoSel.innerHTML = opciones.map(o =>
        `<option value="${o}"${o === estado ? ' selected' : ''}>${o.replace('_', ' ')}</option>`
    ).join('');

    document.getElementById('edit-modal').classList.add('open');
    document.getElementById('modal-save-btn').disabled = false;
}

function closeEditModal() {
    document.getElementById('edit-modal').classList.remove('open');
}

async function saveEdit() {
    const id         = document.getElementById('modal-record-id').value;
    const type       = document.getElementById('modal-record-type').value;
    const estado     = document.getElementById('modal-estado').value;
    const notas      = document.getElementById('modal-notas').value;
    const saveBtn    = document.getElementById('modal-save-btn');
    const msgEl      = document.getElementById('modal-msg');

    saveBtn.disabled = true;
    saveBtn.textContent = '...';
    msgEl.textContent = '';
    msgEl.className = 'modal-msg';

    const action = type === 'campus' ? 'update_campus' : 'update_waitlist';
    const token  = await adminToken();

    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action, id, estado, notas_admin: notas })
    });
    const data = await r.json();

    saveBtn.disabled = false;
    saveBtn.textContent = 'Guardar';

    if (data.success) {
        msgEl.textContent = 'Guardado';
        msgEl.className = 'modal-msg ok';
        adminCache = null;
        setTimeout(() => {
            closeEditModal();
            if (type === 'campus') renderCampus();
            else renderAcademia();
        }, 700);
    } else {
        msgEl.textContent = data.error || 'Error al guardar';
        msgEl.className = 'modal-msg err';
    }
}

// ── ALUMNOS UNIFICADOS ─────────────────────────────────────────────────────
let alumnosIndex    = null;
let activeDetailEmail = null;

function buildAlumnoIndex(data) {
    const map = {};
    const touch = email => {
        const k = (email || '').toLowerCase();
        if (!k) return null;
        if (!map[k]) map[k] = { email: k, nombre: '', telefono: '', sources: [], plataforma: null, campus: [], waitlist: null, seguimiento: [] };
        return map[k];
    };
    (data.users    || []).forEach(u => { const a = touch(u.email); if (!a) return; a.plataforma = u; if (!a.nombre) a.nombre = u.name || u.email.split('@')[0]; if (!a.sources.includes('plataforma')) a.sources.push('plataforma'); });
    (data.campus   || []).forEach(c => { const a = touch(c.email); if (!a) return; a.campus.push(c); if (!a.nombre) a.nombre = c.nombre || ''; if (!a.telefono && c.telefono) a.telefono = c.telefono; if (!a.sources.includes('campus')) a.sources.push('campus'); });
    (data.waitlist || []).forEach(w => { const a = touch(w.email); if (!a) return; a.waitlist = w;   if (!a.nombre) a.nombre = w.nombre || ''; if (!a.sources.includes('academia')) a.sources.push('academia'); });
    (data.seguimiento || []).forEach(s => { const a = touch(s.email); if (!a) return; a.seguimiento.push(s); if (!a.nombre) a.nombre = s.nombre || ''; if (!a.sources.includes('seguimiento')) a.sources.push('seguimiento'); });
    return Object.values(map).sort((a, b) => (a.nombre || a.email).localeCompare(b.nombre || b.email));
}

async function renderAlumnos(refresh = false) {
    activeDetailEmail = null;
    const main = document.getElementById('main-content');
    main.innerHTML = `<div class="content-header"><p class="content-eyebrow">Administración</p><h1 class="content-title">Alumnos</h1></div><p style="color:var(--text-muted);font-size:13px;padding:20px 0;">Cargando...</p>`;

        const data = await fetchAdminData(refresh);
        alumnosIndex = buildAlumnoIndex(data);

function renderAlumnosList(list) {
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Alumnos</h1>

function buildAlumnosListHTML(list) {
    if (!list.length) return '<p style="color:var(--text-muted);font-size:13px;">Sin alumnos todavía.</p>';
    return list.map(a => {
        const tags = a.sources.map(s => `<span class="source-tag ${s}">${s === 'plataforma' ? 'Plat.' : s === 'academia' ? 'Acad.' : s === 'campus' ? 'Campus' : 'Seg.'}</span>`).join('');
        return `<div class="alumno-list-item" onclick="renderAlumnoDetalle('${esc(a.email)}')">
            <div>
                <p class="alumno-list-name">${esc(a.nombre || a.email)}</p>
                <p class="alumno-list-email">${esc(a.email)}${a.telefono ? ' · ' + esc(a.telefono) : ''}</p>
            </div>
            <div class="alumno-source-tags">${tags}</div>
        </div>`;
    }).join('');
}

function filterAlumnos(q) {
    if (!alumnosIndex) return;
    const lq = q.toLowerCase();
    const f = lq ? alumnosIndex.filter(a => (a.nombre || '').toLowerCase().includes(lq) || a.email.includes(lq)) : alumnosIndex;
    document.getElementById('alumnos-list').innerHTML = buildAlumnosListHTML(f);
}

        return `<div class="student-row">
            <div class="student-row-top">
                <div>
                    <p class="student-name">${esc(e.nombre||e.email)}</p>
                    <p class="student-meta">${esc(e.email)} &middot; ${esc(e.temporada||'—')} &middot; ${fecha}</p>
                </div>
                <div class="student-badges">
                    <span class="status-badge status-${sc}">${esc(e.estado||'activo')}</span>
                    ${e.sesiones_mes != null ? `<span class="precio-chip">${e.sesiones_mes} ses/mes</span>` : ''}
                    <button class="btn-edit-student" onclick="openSeguimientoModal('${esc(e.email)}','${esc(e.nombre||e.email)}',${JSON.stringify(e).replace(/'/g,'&#39;')})">Editar</button>
                    <button class="btn-edit-student" onclick="goToAlumno('${esc(e.email)}')">Ver alumno</button>
                </div>
            </div>
            ${e.nivel_actual||e.proxima_revision ? `<div class="student-detail-grid">

function filterSeguimientoList(q) {
    if (!adminCache) return;

function goToAlumno(email) {
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.packId === '__alumnos__'));

// ── SEGUIMIENTO MODAL ──────────────────────────────────────────────────────
function openSeguimientoModal(email, nombre, entry) {
    document.getElementById('seg-email').value           = email;
    document.getElementById('seg-id').value              = entry?.id || '';
    document.getElementById('seg-modal-name').textContent = nombre;
    document.getElementById('seg-modal-type').textContent = entry ? 'Editar seguimiento' : 'Nuevo seguimiento';
    document.getElementById('seg-temporada').value       = entry?.temporada        || '2025-2026';
    document.getElementById('seg-nivel').value           = entry?.nivel_actual     || '';
    document.getElementById('seg-objetivos').value       = entry?.objetivos        || '';
    document.getElementById('seg-obs').value             = entry?.observaciones    || '';
    document.getElementById('seg-sesiones').value        = entry?.sesiones_mes ?? '';
    document.getElementById('seg-revision').value        = entry?.proxima_revision || '';
    document.getElementById('seg-estado').value          = entry?.estado           || 'activo';
    document.getElementById('seg-msg').textContent = '';
    document.getElementById('seg-msg').className = 'modal-msg';
    document.getElementById('seg-save-btn').disabled = false;
    document.getElementById('seg-modal').classList.add('open');
}

function closeSeguimientoModal() {
    document.getElementById('seg-modal').classList.remove('open');
}

async function saveSeguimiento() {
    const id      = document.getElementById('seg-id').value;
    const email   = document.getElementById('seg-email').value;
    const nombre  = document.getElementById('seg-modal-name').textContent;
    const saveBtn = document.getElementById('seg-save-btn');
    const msgEl   = document.getElementById('seg-msg');
    const payload = {
        temporada:        document.getElementById('seg-temporada').value,
        nivel_actual:     document.getElementById('seg-nivel').value,
        objetivos:        document.getElementById('seg-objetivos').value,
        observaciones:    document.getElementById('seg-obs').value,
        sesiones_mes:     parseInt(document.getElementById('seg-sesiones').value) || 0,
        proxima_revision: document.getElementById('seg-revision').value || null,
        estado:           document.getElementById('seg-estado').value,
    };
    const action = id ? 'update_seguimiento' : 'create_seguimiento';
    if (!id) { payload.email = email; payload.nombre = nombre; } else { payload.id = id; }
    saveBtn.disabled = true; saveBtn.textContent = '...';
    msgEl.textContent = ''; msgEl.className = 'modal-msg';
    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action, ...payload })
    });
    const data = await r.json();
    saveBtn.disabled = false; saveBtn.textContent = 'Guardar';
    if (data.success) {
        msgEl.textContent = 'Guardado'; msgEl.className = 'modal-msg ok';
        adminCache = null; alumnosIndex = null;
        setTimeout(async () => {
            closeSeguimientoModal();
            if (activeDetailEmail) {
                const fresh = await fetchAdminData();
                alumnosIndex = buildAlumnoIndex(fresh);
                renderAlumnoDetalle(activeDetailEmail);
            } else {
                renderSeguimientoTab();
            }
        }, 700);
    } else {
        msgEl.textContent = data.error || 'Error al guardar'; msgEl.className = 'modal-msg err';
    }
}
