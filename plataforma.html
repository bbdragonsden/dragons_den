<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma — Dragons Den Academy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F409;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:             #080808;
            --bg-2:           #0a0a0a;
            --bg-3:           #0f0f0f;
            --bg-4:           #141414;
            --bg-5:           #1a1a1a;
            --gold:           #c8a96e;
            --gold-dim:       #a08050;
            --gold-light:     rgba(200,169,110,0.10);
            --gold-border:    rgba(200,169,110,0.20);
            --gold-glow:      rgba(200,169,110,0.06);
            --text:           #f0ede8;
            --text-secondary: #a09890;
            --text-muted:     #5a5550;
            --border:         rgba(255,255,255,0.055);
            --border-strong:  rgba(255,255,255,0.10);
            --red-dim:        rgba(255,80,80,0.08);
            --red-border:     rgba(255,80,80,0.22);
            --green-dim:      rgba(74,222,128,0.08);
            --green-border:   rgba(74,222,128,0.20);
            --sidebar-width:  240px;
            --header-h:       56px;
            --radius:         2px;
        }

        /* ─────────────────────────────────────────
           BASE
        ───────────────────────────────────────── */
        html { scroll-behavior: smooth; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Satoshi', system-ui, sans-serif;
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ─────────────────────────────────────────
           SCROLLBAR
        ───────────────────────────────────────── */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

        /* ─────────────────────────────────────────
           LOADING SCREEN
        ───────────────────────────────────────── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 9999;
        }

        #loading-screen::before {
            content: '';
            position: absolute;
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            letter-spacing: 8px;
            color: var(--gold);
            animation: loadPulse 1.6s ease-in-out infinite;
        }

        .loading-bar {
            width: 80px;
            height: 1px;
            background: var(--border-strong);
            position: relative;
            overflow: hidden;
        }

        .loading-bar::after {
            content: '';
            position: absolute;
            inset-block: 0;
            left: -40px;
            width: 40px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: loadSweep 1.6s ease-in-out infinite;
        }

        @keyframes loadPulse {
            0%, 100% { opacity: 0.25; }
            50%       { opacity: 0.85; }
        }

        @keyframes loadSweep {
            0%   { left: -40px; }
            100% { left: 120px; }
        }

        /* ─────────────────────────────────────────
           APP SHELL
        ───────────────────────────────────────── */
        #app { display: none; min-height: 100dvh; }

        .platform-layout {
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            min-height: 100dvh;
        }

        /* ─────────────────────────────────────────
           SIDEBAR
        ───────────────────────────────────────── */
        .sidebar {
            background: var(--bg-2);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100dvh;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        /* Sidebar header */
        .sidebar-header {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-bottom: 6px;
        }

        .sidebar-brand-icon {
            flex-shrink: 0;
            opacity: 0.9;
        }

        .sidebar-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 15px;
            letter-spacing: 4px;
            color: var(--gold);
            line-height: 1;
        }

        .sidebar-tagline {
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding-left: 30px;
        }

        /* Sidebar nav */
        .sidebar-nav {
            flex: 1;
            padding: 12px 0 8px;
            overflow-y: auto;
        }

        .sidebar-section-label {
            font-size: 8px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 16px 20px 6px;
            opacity: 0.6;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            font-size: 13px;
            font-family: 'Satoshi', sans-serif;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s cubic-bezier(0.16,1,0.3,1),
                        background 0.2s cubic-bezier(0.16,1,0.3,1);
            border: none;
            border-left: 2px solid transparent;
            background: none;
            width: 100%;
            text-align: left;
            position: relative;
        }

        .sidebar-item:hover {
            color: var(--text);
            background: rgba(255,255,255,0.03);
        }

        .sidebar-item.active {
            color: var(--gold);
            background: var(--gold-light);
            border-left-color: var(--gold);
        }

        .sidebar-item.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .sidebar-item.locked:hover {
            color: var(--text-muted);
            background: none;
        }

        .sidebar-item-icon {
            flex-shrink: 0;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .sidebar-item:hover .sidebar-item-icon,
        .sidebar-item.active .sidebar-item-icon {
            opacity: 1;
        }

        .pack-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: inherit;
            opacity: 0.45;
            flex-shrink: 0;
            width: 20px;
        }

        .lock-icon {
            margin-left: auto;
            font-size: 9px;
            opacity: 0.35;
        }

        /* Sidebar divider */
        .sidebar-divider {
            height: 1px;
            background: var(--border);
            margin: 8px 0;
        }

        /* Sidebar footer */
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }

        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .user-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--bg-5);
            border: 1px solid var(--border-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar-initial {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: var(--gold);
            line-height: 1;
        }

        .user-info {
            flex: 1;
            min-width: 0;
        }

        .user-name {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: block;
        }

        .btn-logout {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            background: none;
            border: 1px solid var(--border);
            padding: 5px 9px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            flex-shrink: 0;
            font-family: 'Satoshi', sans-serif;
        }

        .btn-logout:hover {
            color: #ff6b6b;
            border-color: rgba(255,107,107,0.28);
            background: rgba(255,80,80,0.05);
        }

        /* ─────────────────────────────────────────
           MAIN AREA
        ───────────────────────────────────────── */
        .main-area {
            display: flex;
            flex-direction: column;
            min-width: 0;
            background: var(--bg);
        }

        /* ─────────────────────────────────────────
           TOP HEADER BAR (desktop)
        ───────────────────────────────────────── */
        .desktop-header {
            height: var(--header-h);
            border-bottom: 1px solid var(--border);
            background: rgba(8,8,8,0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            position: sticky;
            top: 0;
            z-index: 50;
            flex-shrink: 0;
        }

        .desktop-header-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            color: var(--gold);
            opacity: 0.7;
        }

        .desktop-header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px 5px 6px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            border-radius: 100px;
        }

        .header-user-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--bg-5);
            border: 1px solid var(--gold-border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-user-initial {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 9px;
            color: var(--gold);
            line-height: 1;
        }

        .header-user-name {
            font-size: 11px;
            letter-spacing: 0.3px;
            color: var(--text-secondary);
        }

        /* ─────────────────────────────────────────
           MOBILE TOPBAR
        ───────────────────────────────────────── */
        .mobile-topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: var(--bg-2);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .mobile-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 4px;
            color: var(--gold);
        }

        .mobile-menu-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 13px;
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
            transition: color 0.2s, border-color 0.2s;
        }

        .mobile-menu-btn:hover {
            color: var(--text);
            border-color: var(--border-strong);
        }

        /* Mobile sidebar overlay */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 150;
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }

        .sidebar-overlay.active { display: block; }

        /* ─────────────────────────────────────────
           MAIN CONTENT
        ───────────────────────────────────────── */
        .main-content {
            flex: 1;
            padding: 40px 48px;
            max-width: 860px;
            width: 100%;
            animation: fadeUp 0.35s cubic-bezier(0.16,1,0.3,1) both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes shimmer {
            from { background-position: -400px 0; }
            to   { background-position: 400px 0; }
        }

        /* ─────────────────────────────────────────
           CONTENT HEADER
        ───────────────────────────────────────── */
        .content-header {
            margin-bottom: 36px;
            padding-bottom: 28px;
            border-bottom: 1px solid var(--border);
        }

        .content-eyebrow {
            font-size: 9px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            color: var(--gold);
            opacity: 0.8;
            margin-bottom: 10px;
            font-family: 'Bebas Neue', sans-serif;
        }

        .content-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 54px;
            line-height: 0.92;
            letter-spacing: 1px;
            color: var(--text);
            text-transform: uppercase;
        }

        .content-desc {
            font-size: 13.5px;
            color: var(--text-muted);
            line-height: 1.75;
            margin-top: 14px;
            max-width: 520px;
            letter-spacing: 0.1px;
        }

        /* ─────────────────────────────────────────
           WELCOME GRID
        ───────────────────────────────────────── */
        .welcome-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 1px;
            background: var(--border);
            border: 1px solid var(--border);
        }

        .welcome-pack-card {
            background: var(--bg-3);
            padding: 22px 20px 20px;
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.16,1,0.3,1),
                        border-color 0.2s;
            border: 1px solid transparent;
            position: relative;
            overflow: hidden;
        }

        .welcome-pack-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--gold-glow) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .welcome-pack-card:hover {
            background: var(--bg-4);
            border-color: var(--gold-border);
        }

        .welcome-pack-card:hover::after { opacity: 1; }

        .welcome-pack-card:active { transform: scale(0.99); }

        .welcome-pack-card.locked-card {
            opacity: 0.28;
            cursor: not-allowed;
        }

        .welcome-pack-card.locked-card:hover {
            background: var(--bg-3);
            border-color: transparent;
        }

        .welcome-pack-card.locked-card:hover::after { opacity: 0; }

        .wpc-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 2.5px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .wpc-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            color: var(--text);
            line-height: 1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .wpc-count {
            font-size: 10.5px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 0.3px;
        }

        /* ─────────────────────────────────────────
           VIDEO PLAYER
        ───────────────────────────────────────── */
        .video-player-wrap {
            background: #000;
            aspect-ratio: 16 / 9;
            margin-bottom: 4px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border);
        }

        .video-player-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        .video-placeholder-icon {
            width: 52px;
            height: 52px;
            border: 1px solid var(--border-strong);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-3);
        }

        /* ─────────────────────────────────────────
           MODULE LIST
        ───────────────────────────────────────── */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
        }

        .module-item {
            display: grid;
            grid-template-columns: 44px 1fr auto;
            align-items: center;
            gap: 18px;
            padding: 18px 22px;
            background: var(--bg-3);
            cursor: pointer;
            transition: background 0.2s cubic-bezier(0.16,1,0.3,1),
                        border-color 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .module-item::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--gold);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .module-item:hover {
            background: var(--bg-4);
            border-color: var(--border);
        }

        .module-item:hover::before { opacity: 0.4; }

        .module-item.playing {
            background: var(--bg-4);
            border-color: var(--gold-border);
        }

        .module-item.playing::before { opacity: 1; }

        .module-item.playing .module-num { color: var(--gold); }

        .module-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: var(--bg-5);
            line-height: 1;
            user-select: none;
        }

        .module-info {}

        .module-name {
            font-size: 13.5px;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 3px;
            letter-spacing: 0.1px;
        }

        .module-meta {
            font-size: 10.5px;
            color: var(--text-muted);
            letter-spacing: 0.3px;
        }

        .module-duration {
            font-size: 10.5px;
            color: var(--text-muted);
            letter-spacing: 0.5px;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }

        /* ─────────────────────────────────────────
           LOCKED PACK PANEL
        ───────────────────────────────────────── */
        .locked-panel {
            background: var(--bg-3);
            border: 1px solid var(--border);
            padding: 52px 44px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .locked-panel::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(200,169,110,0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .locked-panel h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 32px;
            color: var(--text);
            margin: 18px 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .locked-panel p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.75;
            max-width: 360px;
            margin: 0 auto 28px;
        }

        .btn-upgrade {
            display: inline-block;
            background: var(--gold);
            color: #000;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            padding: 13px 30px;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.15s;
        }

        .btn-upgrade:hover { opacity: 0.85; }
        .btn-upgrade:active { transform: scale(0.98); }

        /* ─────────────────────────────────────────
           ADMIN PANEL
        ───────────────────────────────────────── */
        .admin-search {
            background: var(--bg-3);
            border: 1px solid var(--border-strong);
            color: var(--text);
            font-family: 'Satoshi', sans-serif;
            font-size: 13px;
            padding: 10px 14px;
            outline: none;
            width: 300px;
            max-width: 100%;
            transition: border-color 0.2s;
        }

        .admin-search:focus {
            border-color: var(--gold-border);
        }

        .admin-search::placeholder { color: var(--text-muted); }

        .admin-refresh-btn {
            background: none;
            border: 1px solid var(--border-strong);
            color: var(--text-muted);
            font-size: 9px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 9px 14px;
            cursor: pointer;
            font-family: 'Satoshi', sans-serif;
            transition: color 0.2s, border-color 0.2s, background 0.2s;
        }

        .admin-refresh-btn:hover {
            color: var(--text);
            border-color: var(--border-strong);
            background: rgba(255,255,255,0.03);
        }

        /* User rows — NOTE: .user-row is used by BOTH the sidebar footer
           and the admin panel. The sidebar footer uses it as-is; the admin
           panel wraps it inside #admin-users-list. We keep a shared base
           and let context narrow the styles. */
        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        /* Admin-specific user row override (scoped to the list) */
        #admin-users-list .user-row {
            display: block;
            padding: 18px 20px;
            background: var(--bg-3);
            border: 1px solid var(--border);
            margin-bottom: 1px;
            transition: border-color 0.2s;
        }

        #admin-users-list .user-row:hover {
            border-color: var(--border-strong);
        }

        .user-row-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .user-info-name {
            font-size: 13.5px;
            color: var(--text);
            font-weight: 500;
            letter-spacing: 0.1px;
        }

        .user-info-email {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
            letter-spacing: 0.2px;
        }

        .user-badges {
            display: flex;
            gap: 5px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 7.5px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 3px 7px;
            border: 1px solid;

// ── Auth ──────────────────────────────────────────────────────────────────
async function checkAuth() {
    // Handle OAuth/email confirmation code in URL
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
        await sb.auth.exchangeCodeForSession(code);
        window.history.replaceState({}, '', window.location.pathname);
    }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) return window.location.href = 'login.html';

    const user = session.user;
    const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email.split('@')[0];
    isAdmin = user.user_metadata?.is_admin === true;

    // Fetch pack permissions from DB
    const { data: packsData } = await sb.from('user_packs').select('pack_id');
    userPacks = packsData ? packsData.map(p => p.pack_id) : [];

    currentUser = { name, email: user.email };
    init();
}

function hasAccess(packId) {
    if (userPacks.includes('all') || userPacks.includes('completo')) return true;
    return userPacks.includes(packId);
}

function formatExpiry(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const diff = Math.round((d - Date.now()) / 86400000);
    if (diff < 0)   return `Expiró hace ${Math.abs(diff)}d`;
    if (diff === 0) return 'Expira hoy';
    if (diff === 1) return 'Mañana';
    if (diff <= 30) return `${diff} días`;
    return d.toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' });
}

function expiryStatus(dateStr) {
    if (!dateStr) return 'expired';
    const diff = Math.round((new Date(dateStr) - Date.now()) / 86400000);
    if (diff < 0)   return 'expired';
    if (diff <= 30) return 'expiring';
    return 'valid';
}

async function renderAdmin(refresh = false) {
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Alumnos</h1>
        </div>
        <p style="color:var(--text-muted);font-size:13px;padding:20px 0;">Cargando...</p>`;

    if (refresh) adminCache = null;
    if (!adminCache) {
        const token = await adminToken();
        const r = await fetch('/api/admin-data', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!r.ok) {
            main.querySelector('p').textContent = 'Error al cargar. Recarga la página.';
            return;
        }
        adminCache = await r.json();
    }
    renderAdminPanel(adminCache.users);
}

function renderAdminPanel(users) {
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Alumnos</h1>
            <p class="content-desc">${users.length} registrados &middot; ${users.filter(u => u.confirmed).length} confirmados</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
            <input class="admin-search" id="admin-search" placeholder="Buscar por nombre o email..." oninput="filterAdminUsers(this.value)">
            <button class="admin-refresh-btn" onclick="renderAdmin(true)">Actualizar</button>
        </div>
        <div id="admin-users-list">${buildUserList(users)}</div>`;
}

function buildUserList(users) {
    if (!users.length) return '<p style="color:var(--text-muted);font-size:13px;">Sin usuarios.</p>';
    return users.map(u => {
        const packTags = u.packs.length
            ? u.packs.map(p => `
                <span class="pack-tag ${expiryStatus(p.expires_at)}">
                    <span class="pack-tag-name">${p.pack}</span>
                    <span class="pack-tag-expiry">${formatExpiry(p.expires_at)}</span>
                    <button class="pack-revoke" onclick="revokePack('${u.id}','${p.pack}',this)" title="Revocar">&times;</button>
                </span>`).join('')
            : '<span class="no-packs-label">Sin acceso</span>';

        return `<div class="user-row" id="urow-${u.id}">
            <div class="user-row-top">
                <div>
                    <p class="user-info-name">${u.name || '—'}</p>
                    <p class="user-info-email">${u.email}</p>
                    <div class="user-badges">
                        <span class="badge ${u.confirmed ? 'badge-ok' : 'badge-pending'}">${u.confirmed ? 'Confirmado' : 'Sin confirmar'}</span>
                        ${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''}
                    </div>
                </div>
            </div>
            <div class="user-packs-row" id="ptags-${u.id}">${packTags}</div>
            <div class="assign-row">
                <select class="assign-select" id="sel-${u.id}">
                    <option value="">— Pack a asignar —</option>
                    <option value="tiro">Pack Tiro</option>
                    <option value="footwork">Pack Footwork</option>
                    <option value="defensa">Pack Defensa</option>
                    <option value="fisico">Pack Físico</option>
                    <option value="mental">Pack Mental</option>
                    <option value="completo">Pack Completo</option>
                    <option value="all">Acceso Total</option>
                </select>
                <button class="btn-assign" onclick="assignPack('${u.id}',this)">Asignar 1 año</button>
                <span class="assign-msg" id="msg-${u.id}"></span>
            </div>
        </div>`;
    }).join('');
}

function filterAdminUsers(q) {
    if (!adminCache) return;
    const lq = q.toLowerCase();
    const filtered = lq
        ? adminCache.users.filter(u => u.email.toLowerCase().includes(lq) || (u.name || '').toLowerCase().includes(lq))
        : adminCache.users;
    document.getElementById('admin-users-list').innerHTML = buildUserList(filtered);
}

function showMsg(userId, type, text) {
    const el = document.getElementById(`msg-${userId}`);
    if (!el) return;
    el.className = `assign-msg ${type}`;
    el.textContent = text;
    if (type === 'ok') setTimeout(() => { el.className = 'assign-msg'; el.textContent = ''; }, 4000);
}

async function assignPack(userId, btn) {
    const sel = document.getElementById(`sel-${userId}`);
    const pack = sel.value;
    if (!pack) return;
    btn.disabled = true;
    btn.textContent = '...';

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'assign', userId, pack })
    });
    const data = await r.json();
    btn.disabled = false;
    btn.textContent = 'Asignar 1 año';

    if (data.success) {
        showMsg(userId, 'ok', data.message || 'Pack asignado');
        adminCache = null;
        setTimeout(async () => {
            await renderAdmin();
            document.getElementById(`urow-${userId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 800);
    } else {
        showMsg(userId, 'err', data.error || 'Error al asignar');
    }
}

async function revokePack(userId, pack, btn) {
    btn.disabled = true;

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'revoke', userId, pack })
    });
    const data = await r.json();
    if (data.success) {
        showMsg(userId, 'ok', `Pack "${pack}" revocado`);
        adminCache = null;
        setTimeout(async () => { await renderAdmin(); }, 800);
    } else {
        btn.disabled = false;
        showMsg(userId, 'err', data.error || 'Error al revocar');
    }
}

// ── Start ─────────────────────────────────────────────────────────────────
checkAuth();
</script>

</body>
</html>
