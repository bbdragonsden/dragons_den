});

// Refresh detail view after assign/revoke pack (override to stay in detail)
const _origAssignSuccess = assignPack;
async function assignPack(userId, btn) {
    const sel = document.getElementById(`sel-${userId}`);
    const pack = sel.value;
    if (!pack) return;
    btn.disabled = true; btn.textContent = '...';
    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'assign', userId, pack })
    });
    const data = await r.json();
    btn.disabled = false; btn.textContent = 'Asignar 1 año';
    if (data.success) {
        showMsg(userId, 'ok', data.message || 'Pack asignado');
        adminCache = null; alumnosIndex = null;
        setTimeout(async () => {
            if (activeDetailEmail) {
                const fresh = await fetchAdminData();
                alumnosIndex = buildAlumnoIndex(fresh);
                renderAlumnoDetalle(activeDetailEmail);
            } else {
                await renderAdmin();
                document.getElementById(`urow-${userId}`)?.scrollIntoView({ behavior:'smooth', block:'center' });
            }
        }, 800);
    } else { showMsg(userId, 'err', data.error || 'Error al asignar'); }
}

async function revokePack(userId, pack, btn) {
    btn.disabled = true;
    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'revoke', userId, pack })
    });
    const data = await r.json();
    if (data.success) {
        showMsg(userId, 'ok', `Pack "${pack}" revocado`);
        adminCache = null; alumnosIndex = null;
        setTimeout(async () => {
            if (activeDetailEmail) {
                const fresh = await fetchAdminData();
                alumnosIndex = buildAlumnoIndex(fresh);
                renderAlumnoDetalle(activeDetailEmail);
            } else {
                await renderAdmin();
            }
        }, 800);
    } else { btn.disabled = false; showMsg(userId, 'err', data.error || 'Error al revocar'); }
}

// ── ADMIN: VIDEOS ─────────────────────────────────────────────────────────
async function renderVideosAdmin(refresh = false) {
    const main = document.getElementById('main-content');
    main.innerHTML = `<div class="content-header"><p class="content-eyebrow">Administración</p><h1 class="content-title">Análisis de Video</h1></div><p style="color:var(--text-muted);font-size:13px;padding:20px 0;">Cargando...</p>`;
    try {
        const data = await fetchAdminData(refresh);
        renderVideosAdminPanel(data.videos || [], data.users || []);
    } catch { main.querySelector('p').textContent = 'Error al cargar.'; }
}

function renderVideosAdminPanel(videos, users) {
    const main = document.getElementById('main-content');
    const pendientes  = videos.filter(v => v.estado === 'pendiente').length;
    const completados = videos.filter(v => v.estado === 'completado').length;

    const buildList = (vids) => {
        if (!vids.length) return '<p style="color:var(--text-muted);font-size:13px;">Sin solicitudes todavía.</p>';
        return vids.map(v => {
            const u = users.find(u => u.email.toLowerCase() === (v.email||'').toLowerCase());
            const fecha = v.created_at ? new Date(v.created_at).toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' }) : '';
            const stLabel = { pendiente:'Pendiente', en_revision:'En revisión', completado:'Analizado' }[v.estado] || v.estado;
            return `<div class="video-card" id="vadmin-${esc(v.id)}">
                <div class="video-card-header">
                    <div>
                        <p class="video-card-title">${esc(v.titulo)}</p>
                        <p class="video-card-meta">${esc(v.email)} &middot; ${fecha}</p>
                    </div>
                    <span class="video-status ${esc(v.estado||'pendiente')}">${esc(stLabel)}</span>
                </div>
                <p class="video-card-url"><a href="${esc(v.url_video)}" target="_blank" rel="noopener">${esc(v.url_video)}</a></p>
                ${v.descripcion ? `<p class="video-card-desc">${esc(v.descripcion)}</p>` : ''}
                ${v.notas_admin ? `<div class="video-notas">${esc(v.notas_admin)}</div>` : ''}
                <div class="assign-row" style="margin-top:10px;">
                    <select class="assign-select" id="vs-${esc(v.id)}">
                        <option value="pendiente"${v.estado==='pendiente'?' selected':''}>Pendiente</option>
                        <option value="en_revision"${v.estado==='en_revision'?' selected':''}>En revisión</option>
                        <option value="completado"${v.estado==='completado'?' selected':''}>Analizado</option>
                    </select>
                    <button class="btn-assign" onclick="openVideoEditModal('${esc(v.id)}','${esc(v.estado||'pendiente')}',${JSON.stringify(v.notas_admin||'')})">Añadir análisis</button>
                    ${u ? `<button class="btn-edit-student" onclick="goToAlumno('${esc(v.email)}')">Ver alumno</button>` : ''}
                </div>
            </div>`;
        }).join('');
    };

    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Análisis de Video</h1>
            <p class="content-desc">${videos.length} solicitudes &middot; ${pendientes} pendientes &middot; ${completados} completados</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
            <input class="admin-search" id="vadmin-search" placeholder="Buscar..." oninput="filterVideosAdmin(this.value)">
            <button class="admin-refresh-btn" onclick="renderVideosAdmin(true)">Actualizar</button>
        </div>
        <div id="vadmin-list">${buildList(videos)}</div>`;

}

function filterVideosAdmin(q) {
    if (!adminCache?.videos) return;
    const lq = q.toLowerCase();
    const f = lq ? adminCache.videos.filter(v => (v.titulo||'').toLowerCase().includes(lq) || (v.email||'').toLowerCase().includes(lq)) : adminCache.videos;
    const users = adminCache.users || [];
    if (!f.length) { document.getElementById('vadmin-list').innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Sin resultados.</p>'; return; }
    document.getElementById('vadmin-list').innerHTML = f.map(v => {
        const u = users.find(u => u.email.toLowerCase() === (v.email||'').toLowerCase());
        const fecha = v.created_at ? new Date(v.created_at).toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' }) : '';
        const stLabel = { pendiente:'Pendiente', en_revision:'En revisión', completado:'Analizado' }[v.estado] || v.estado;
        return `<div class="video-card">
            <div class="video-card-header"><div><p class="video-card-title">${esc(v.titulo)}</p><p class="video-card-meta">${esc(v.email)} &middot; ${fecha}</p></div><span class="video-status ${esc(v.estado||'pendiente')}">${esc(stLabel)}</span></div>
            <p class="video-card-url"><a href="${esc(v.url_video)}" target="_blank" rel="noopener">${esc(v.url_video)}</a></p>
            ${v.descripcion ? `<p class="video-card-desc">${esc(v.descripcion)}</p>` : ''}
            ${v.notas_admin ? `<div class="video-notas">${esc(v.notas_admin)}</div>` : ''}
            <div class="assign-row" style="margin-top:10px;">
                <select class="assign-select" id="vs-${esc(v.id)}"><option value="pendiente"${v.estado==='pendiente'?' selected':''}>Pendiente</option><option value="en_revision"${v.estado==='en_revision'?' selected':''}>En revisión</option><option value="completado"${v.estado==='completado'?' selected':''}>Analizado</option></select>
                <button class="btn-assign" onclick="openVideoEditModal('${esc(v.id)}','${esc(v.estado||'pendiente')}',${JSON.stringify(v.notas_admin||'')})">Añadir análisis</button>
                ${u ? `<button class="btn-edit-student" onclick="goToAlumno('${esc(v.email)}')">Ver alumno</button>` : ''}
            </div>
        </div>`;
    }).join('');
}

function openVideoEditModal(id, estado, notas) {
    document.getElementById('modal-record-id').value   = id;
    document.getElementById('modal-record-type').value = 'video';
    document.getElementById('modal-student-name').textContent = '';
    document.getElementById('modal-type-label').textContent = 'Análisis de video';
    document.getElementById('modal-notas').value = notas || '';
    document.getElementById('modal-notas').placeholder = 'Escribe tu análisis del video...';
    document.getElementById('modal-msg').textContent = '';
    document.getElementById('modal-msg').className = 'modal-msg';
    const estadoSel = document.getElementById('modal-estado');
    estadoSel.innerHTML = ['pendiente','en_revision','completado'].map(o =>
        `<option value="${o}"${o===estado?' selected':''}>${{pendiente:'Pendiente',en_revision:'En revisión',completado:'Analizado'}[o]}</option>`
    ).join('');
    document.getElementById('edit-modal').classList.add('open');
    document.getElementById('modal-save-btn').disabled = false;
}

// Override saveEdit to handle 'video' type
const _origSaveEdit = saveEdit;
async function saveEdit() {
    const type = document.getElementById('modal-record-type').value;
    if (type === 'video') {
        const id    = document.getElementById('modal-record-id').value;
        const estado = document.getElementById('modal-estado').value;
        const notas  = document.getElementById('modal-notas').value;
        const saveBtn = document.getElementById('modal-save-btn');
        const msgEl   = document.getElementById('modal-msg');
        saveBtn.disabled = true; saveBtn.textContent = '...';
        const token = await adminToken();
        const r = await fetch('/api/admin-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ action: 'update_video', id, estado, notas_admin: notas })
        });
        const data = await r.json();
        saveBtn.disabled = false; saveBtn.textContent = 'Guardar';
        if (data.success) {
            msgEl.textContent = 'Guardado'; msgEl.className = 'modal-msg ok';
            adminCache = null;
            setTimeout(() => { closeEditModal(); renderVideosAdmin(); }, 700);
        } else {
            msgEl.textContent = data.error || 'Error'; msgEl.className = 'modal-msg err';
        }
        return;
    }
    _origSaveEdit();
}

// ── ADMIN: MENSAJES ────────────────────────────────────────────────────────
async function renderMensajesAdmin(refresh = false) {
    const main = document.getElementById('main-content');
    main.innerHTML = `<div class="content-header"><p class="content-eyebrow">Administración</p><h1 class="content-title">Mensajes</h1></div><p style="color:var(--text-muted);font-size:13px;padding:20px 0;">Cargando...</p>`;
    try {
        const data = await fetchAdminData(refresh);
        renderMensajesAdminPanel(data.mensajes || [], data.users || []);
    } catch { main.querySelector('p').textContent = 'Error al cargar.'; }
}

function renderMensajesAdminPanel(msgs, users) {
    const main = document.getElementById('main-content');
    // Group by email
    const byEmail = {};
    msgs.forEach(m => {
        const k = (m.email||'').toLowerCase();
        if (!byEmail[k]) byEmail[k] = { email: k, msgs: [] };
        byEmail[k].msgs.push(m);
    });
    const threads = Object.values(byEmail).sort((a,b) => {
        const la = a.msgs[a.msgs.length-1]?.created_at || '';
        const lb = b.msgs[b.msgs.length-1]?.created_at || '';
        return lb.localeCompare(la);
    });

    const listHTML = threads.length ? threads.map(t => {
        const u = users.find(u => u.email.toLowerCase() === t.email);
        const nombre = u?.name || t.email;
        const unread = t.msgs.filter(m => !m.de_admin && !m.leido).length;
        const last = t.msgs[t.msgs.length-1];
        const hora = last?.created_at ? new Date(last.created_at).toLocaleString('es', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
        return `<div class="alumno-list-item" onclick="openAdminThread('${esc(t.email)}','${esc(nombre)}')">
            <div>
                <p class="alumno-list-name">${esc(nombre)}</p>
                <p class="alumno-list-email">${esc(t.email)} &middot; ${hora}</p>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
                ${unread ? `<span class="unread-dot" title="${unread} sin leer"></span>` : ''}
                <span style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);">${t.msgs.length} msgs</span>
            </div>
        </div>`;
    }).join('') : '<p style="color:var(--text-muted);font-size:13px;">Sin mensajes todavía.</p>';

    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Mensajes</h1>
            <p class="content-desc">${threads.length} conversaciones</p>
        </div>
        <div id="mensajes-admin-list">${listHTML}</div>`;

    window._adminMsgData = { msgs, users };
}

function openAdminThread(email, nombre) {
    if (!window._adminMsgData) return;
    const { msgs, users } = window._adminMsgData;
    const u = users.find(u => u.email.toLowerCase() === email.toLowerCase());
    if (!u) return;
    const thread = msgs.filter(m => (m.email||'').toLowerCase() === email.toLowerCase());
    const main = document.getElementById('main-content');

    const threadHTML = thread.length
        ? thread.map(m => {
            const hora = m.created_at ? new Date(m.created_at).toLocaleString('es', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
            const cls  = m.de_admin ? 'admin-msg' : 'user-msg';
            const from = m.de_admin ? 'Tú (admin)' : esc(nombre);
            return `<div class="msg-bubble ${cls}">
                <p class="msg-meta">${from} &middot; ${hora}</p>
                ${esc(m.contenido).replace(/\n/g,'<br>')}
            </div>`;
          }).join('')
        : '<p class="msg-empty">Sin mensajes.</p>';

    main.innerHTML = `
        <button class="detail-back" onclick="renderMensajesAdmin()">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
            Volver a Mensajes
        </button>
        <p class="detail-profile-name">${esc(nombre)}</p>
        <p class="detail-profile-meta">${esc(email)}</p>
        <div class="msg-thread" style="margin-top:24px;">${threadHTML}</div>
        <div class="msg-compose" style="max-width:680px;">
            <textarea class="msg-input" id="admin-reply-input" placeholder="Escribe tu respuesta..."></textarea>
            <div style="display:flex;align-items:center;gap:12px;">
                <button class="btn-send-msg" id="admin-reply-btn" onclick="sendAdminReply('${esc(u.id)}','${esc(email)}','${esc(nombre)}')">Enviar</button>
                <span id="admin-reply-status" style="font-size:12px;"></span>
            </div>
        </div>`;

    // Mark unread as read
    adminToken().then(token => fetch('/api/admin-action', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`},
        body: JSON.stringify({ action:'mark_read', targetUserId: u.id })
    }));
}

async function sendAdminReply(targetUserId, targetEmail, nombre) {
    const btn    = document.getElementById('admin-reply-btn');
    const input  = document.getElementById('admin-reply-input');
    const status = document.getElementById('admin-reply-status');
    const contenido = (input?.value || '').trim();
    if (!contenido) return;
    btn.disabled = true; btn.textContent = '...';
    status.textContent = ''; status.style.color = '';
    try {
        const token = await adminToken();
        const r = await fetch('/api/admin-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ action: 'send_message', targetUserId, targetEmail, contenido })
        });
        const d = await r.json();
        btn.disabled = false; btn.textContent = 'Enviar';
        if (d.success) {
            adminCache = null;
            const data = await fetchAdminData();
            window._adminMsgData = { msgs: data.mensajes || [], users: data.users || [] };
            openAdminThread(targetEmail, nombre);
        } else {
            status.textContent = d.error || 'Error'; status.style.color = '#ff5050';
        }
    } catch {
        btn.disabled = false; btn.textContent = 'Enviar';
        status.textContent = 'Error de red'; status.style.color = '#ff5050';
    }
}

// Admin reply modal (from student detail page)
function openMsgReplyModal(userId, email, nombre) {
    document.getElementById('mrm-userid').value = userId;
    document.getElementById('mrm-email').value  = email;
    document.getElementById('mrm-name').textContent = nombre;
    document.getElementById('mrm-texto').value  = '';
    document.getElementById('mrm-msg').textContent = '';
    document.getElementById('mrm-msg').className = 'modal-msg';
    document.getElementById('mrm-save-btn').disabled = false;
    document.getElementById('msg-reply-modal').classList.add('open');
}
function closeMsgReplyModal() { document.getElementById('msg-reply-modal').classList.remove('open'); }

async function sendAdminMessage() {
    const btn  = document.getElementById('mrm-save-btn');
    const msg  = document.getElementById('mrm-msg');
    const targetUserId = document.getElementById('mrm-userid').value;
    const targetEmail  = document.getElementById('mrm-email').value;
    const contenido    = document.getElementById('mrm-texto').value.trim();
    if (!contenido) { msg.textContent = 'Mensaje vacío'; msg.className = 'modal-msg err'; return; }
    btn.disabled = true; btn.textContent = '...';
    msg.textContent = ''; msg.className = 'modal-msg';
    try {
        const token = await adminToken();
        const r = await fetch('/api/admin-action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({ action: 'send_message', targetUserId, targetEmail, contenido })
        });
        const d = await r.json();
        btn.disabled = false; btn.textContent = 'Enviar';
        if (d.success) {
            msg.textContent = 'Mensaje enviado'; msg.className = 'modal-msg ok';
            adminCache = null;
            setTimeout(() => {
                closeMsgReplyModal();
                if (activeDetailEmail) {
                    fetchAdminData().then(data => {
                        alumnosIndex = buildAlumnoIndex(data);
                        renderAlumnoDetalle(activeDetailEmail);
                    });
                }
            }, 700);
        } else {
            msg.textContent = d.error || 'Error'; msg.className = 'modal-msg err';
        }
    } catch {
        btn.disabled = false; btn.textContent = 'Enviar';
        msg.textContent = 'Error de red'; msg.className = 'modal-msg err';
    }
}
