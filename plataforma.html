<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma — Dragons Den Academy</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F409;</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Satoshi:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #c8a96e;
            --bg: #080808;
            --surface: #0f0f0f;
            --surface2: #141414;
            --border: #1e1e1e;
            --text: #e8e8e8;
            --muted: #555;
            --sidebar-w: 260px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Satoshi', Arial, sans-serif;
            min-height: 100dvh;
        }

        /* ── LOADING ── */
        #loading-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 13px;
            letter-spacing: 6px;
            color: var(--gold);
            opacity: 0.6;
            animation: pulse 1.4s ease-in-out infinite;
        }
        @keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:0.9} }

        /* ── MAIN LAYOUT ── */
        #app { display: none; min-height: 100dvh; }

        .platform-layout {
            display: grid;
            grid-template-columns: var(--sidebar-w) 1fr;
            min-height: 100dvh;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            background: var(--surface);
            border-right: 1px solid var(--border);
            position: sticky;
            top: 0;
            height: 100dvh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }
        .sidebar-header {
            padding: 28px 24px 24px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--gold);
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
        }
        .sidebar-tagline {
            font-size: 10px;
            color: #2a2a2a;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .sidebar-nav {
            flex: 1;
            padding: 20px 0;
        }
        .sidebar-section-label {
            font-size: 8px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: #2a2a2a;
            padding: 16px 24px 8px;
        }
        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 24px;
            font-size: 13px;
            color: var(--muted);
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            position: relative;
        }
        .sidebar-item:hover { color: var(--text); background: rgba(255,255,255,0.02); }
        .sidebar-item.active {
            color: var(--gold);
            background: rgba(200,169,110,0.05);
        }
        .sidebar-item.active::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 2px;
            background: var(--gold);
        }
        .sidebar-item.locked { opacity: 0.35; cursor: not-allowed; }
        .sidebar-item.locked:hover { color: var(--muted); background: none; }
        .pack-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: inherit;
            opacity: 0.5;
            flex-shrink: 0;
        }
        .lock-icon {
            margin-left: auto;
            font-size: 10px;
            opacity: 0.4;
        }
        .sidebar-footer {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
        }
        .user-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .user-name {
            font-size: 12px;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn-logout {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--muted);
            background: none;
            border: 1px solid var(--border);
            padding: 5px 10px;
            cursor: pointer;
            transition: color 0.2s, border-color 0.2s;
            flex-shrink: 0;
        }
        .btn-logout:hover { color: #ff6b6b; border-color: rgba(255,107,107,0.3); }

        /* ── MAIN CONTENT ── */
        .main-content {
            padding: 48px 56px;
            max-width: 900px;
        }

        .content-header {
            margin-bottom: 40px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--border);
        }
        .content-eyebrow {
            font-size: 9px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--gold);
            margin-bottom: 10px;
        }
        .content-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 52px;
            line-height: 0.95;
            letter-spacing: -0.5px;
            color: #fff;
            text-transform: uppercase;
        }
        .content-desc {
            font-size: 14px;
            color: var(--muted);
            line-height: 1.7;
            margin-top: 14px;
            max-width: 560px;
        }

        /* ── VIDEO LIST ── */
        .module-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .module-item {
            display: grid;
            grid-template-columns: 48px 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 20px 24px;
            background: var(--surface);
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .module-item:hover { background: var(--surface2); border-color: var(--border); }
        .module-item.playing {
            background: var(--surface2);
            border-color: rgba(200,169,110,0.2);
        }
        .module-item.playing .module-num { color: var(--gold); }
        .module-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: #222;
            line-height: 1;
        }
        .module-info {}
        .module-name {
            font-size: 14px;
            color: var(--text);
            font-weight: 500;
            margin-bottom: 3px;
        }
        .module-meta {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.3px;
        }
        .module-duration {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ── VIDEO PLAYER ── */
        .video-player-wrap {
            background: #000;
            aspect-ratio: 16/9;
            margin-bottom: 24px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-player-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .video-placeholder {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
            font-size: 13px;
            letter-spacing: 0.5px;
        }
        .video-placeholder-icon {
            width: 56px;
            height: 56px;
            border: 1px solid var(--border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ── LOCKED PACK ── */
        .locked-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 56px 48px;
            text-align: center;
        }
        .locked-panel h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 36px;
            color: #fff;
            margin: 16px 0 10px;
            text-transform: uppercase;
        }
        .locked-panel p {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.7;
            max-width: 380px;
            margin: 0 auto 28px;
        }
        .btn-upgrade {
            display: inline-block;
            background: var(--gold);
            color: #000;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 14px;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 14px 32px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .btn-upgrade:hover { opacity: 0.85; }

        /* ── WELCOME ── */
        .welcome-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2px;
            margin-top: 8px;
        }
        .welcome-pack-card {
            background: var(--surface);
            padding: 24px 20px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }
        .welcome-pack-card:hover { background: var(--surface2); border-color: var(--border); }
        .welcome-pack-card.locked-card { opacity: 0.3; cursor: not-allowed; }
        .welcome-pack-card.locked-card:hover { background: var(--surface); border-color: transparent; }
        .wpc-num {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .wpc-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 22px;
            color: #fff;
            line-height: 1;
            text-transform: uppercase;
        }
        .wpc-count {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
        }

        /* ── MOBILE TOPBAR ── */
        .mobile-topbar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .mobile-logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            color: var(--gold);
        }
        .mobile-menu-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 12px;
            font-size: 10px;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* ── ADMIN PANEL ── */
        .admin-search { background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: 'Satoshi', Arial, sans-serif; font-size: 13px; padding: 10px 14px; outline: none; width: 280px; max-width: 100%; }
        .admin-search:focus { border-color: rgba(200,169,110,0.4); }
        .admin-search::placeholder { color: #333; }
        .admin-refresh-btn { background: none; border: 1px solid var(--border); color: var(--muted); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; padding: 8px 14px; cursor: pointer; transition: color 0.2s, border-color 0.2s; }
        .admin-refresh-btn:hover { color: var(--text); border-color: #444; }

        .user-row { padding: 20px 24px; background: var(--surface); border: 1px solid transparent; margin-bottom: 2px; }
        .user-row:hover { border-color: var(--border); }
        .user-row-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
        .user-info-name { font-size: 14px; color: var(--text); font-weight: 500; }
        .user-info-email { font-size: 11px; color: var(--muted); margin-top: 2px; }
        .user-badges { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
        .badge { font-size: 8px; letter-spacing: 1.5px; text-transform: uppercase; padding: 3px 7px; border: 1px solid; }
        .badge-ok { color: #4ade80; border-color: rgba(74,222,128,0.2); }
        .badge-pending { color: #555; border-color: #222; }
        .badge-admin { color: var(--gold); border-color: rgba(200,169,110,0.3); }

        .user-packs-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; min-height: 28px; }
        .pack-tag { display: inline-flex; align-items: center; gap: 5px; font-size: 10px; padding: 4px 9px; border: 1px solid; }
        .pack-tag.valid { color: var(--gold); border-color: rgba(200,169,110,0.25); background: rgba(200,169,110,0.05); }
        .pack-tag.expiring { color: #fbbf24; border-color: rgba(251,191,36,0.25); background: rgba(251,191,36,0.05); }
        .pack-tag.expired { color: #444; border-color: #1a1a1a; }
        .pack-tag-name { font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .pack-tag-expiry { opacity: 0.65; font-size: 9px; }
        .pack-revoke { background: none; border: none; cursor: pointer; color: inherit; opacity: 0.35; padding: 0 1px; font-size: 13px; line-height: 1; transition: opacity 0.2s; }
        .pack-revoke:hover { opacity: 1; }
        .no-packs-label { font-size: 11px; color: #2a2a2a; letter-spacing: 0.5px; }

        .assign-row { display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; }
        .assign-select { background: var(--bg); border: 1px solid var(--border); color: var(--text); font-family: 'Satoshi', Arial, sans-serif; font-size: 12px; padding: 8px 12px; outline: none; cursor: pointer; flex: 1; min-width: 160px; max-width: 220px; }
        .assign-select:focus { border-color: rgba(200,169,110,0.4); }
        .btn-assign { background: var(--gold); color: #000; border: none; font-family: 'Bebas Neue', sans-serif; font-size: 13px; letter-spacing: 2px; padding: 9px 18px; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
        .btn-assign:hover { opacity: 0.85; }
        .btn-assign:disabled { opacity: 0.3; cursor: not-allowed; }
        .assign-msg { font-size: 12px; font-family: 'Satoshi', Arial, sans-serif; padding: 4px 10px; border-radius: 4px; white-space: nowrap; display: none; }
        .assign-msg.ok  { display: inline-block; color: #2d6a2d; background: rgba(45,106,45,0.1); border: 1px solid rgba(45,106,45,0.25); }
        .assign-msg.err { display: inline-block; color: #8b2020; background: rgba(139,32,32,0.1); border: 1px solid rgba(139,32,32,0.25); }

        @media (max-width: 768px) {
            .platform-layout { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                z-index: 200;
                transform: translateX(-100%);
                transition: transform 0.3s;
                width: var(--sidebar-w);
            }
            .sidebar.open { transform: translateX(0); }
            .mobile-topbar { display: flex; }
            .main-content { padding: 28px 20px; }
        }
    </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
    <p class="loading-logo">Dragons Den</p>
</div>

<!-- App (hidden until auth verified) -->
<div id="app">

    <!-- Mobile topbar -->
    <div class="mobile-topbar">
        <span class="mobile-logo">Dragons Den</span>
        <button class="mobile-menu-btn" id="mobile-menu-btn">Menú</button>
    </div>

    <div class="platform-layout">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <a href="academia.html" class="sidebar-logo">Dragons Den</a>
                <p class="sidebar-tagline">Academia Online</p>
            </div>

            <nav class="sidebar-nav" id="sidebar-nav" aria-label="Packs">
                <p class="sidebar-section-label">Tus packs</p>

            </nav>

            <div class="sidebar-footer">
                <div class="user-row">

        <!-- Main -->
        <main class="main-content" id="main-content" aria-live="polite">

        </main>

    </div>
</div>

<script>
// ── Pack definitions ──────────────────────────────────────────────────────

        ]
    }
];

const SUPABASE_URL = 'https://oyuhyrzjhaqzawwnmwcv.supabase.co';
const SUPABASE_KEY = 'sb_publishable_W4UBtORpWtWnKGzw-x9VbA_gPsDQfzQ';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── State ─────────────────────────────────────────────────────────────────
let currentUser = null;
let userPacks = [];
let activePack = null;
let activeModule = null;
let isAdmin = false;
let adminCache = null;

// ── Auth ──────────────────────────────────────────────────────────────────
async function checkAuth() {
    // Handle OAuth/email confirmation code in URL
    const code = new URLSearchParams(window.location.search).get('code');
    if (code) {
        await sb.auth.exchangeCodeForSession(code);
        window.history.replaceState({}, '', window.location.pathname);
    }

    const { data: { session } } = await sb.auth.getSession();
    if (!session) return window.location.href = 'login.html';

    const user = session.user;
    const name = user.user_metadata?.name || user.user_metadata?.full_name || user.email.split('@')[0];
    isAdmin = user.user_metadata?.is_admin === true;

    // Fetch pack permissions from DB
    const { data: packsData } = await sb.from('user_packs').select('pack_id');
    userPacks = packsData ? packsData.map(p => p.pack_id) : [];

    currentUser = { name, email: user.email };
    init();
}

function hasAccess(packId) {
    if (userPacks.includes('all') || userPacks.includes('completo')) return true;
    return userPacks.includes(packId);
}

// ── Init ──────────────────────────────────────────────────────────────────
function init() {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('user-name-display').textContent = currentUser.name;

    renderSidebar();
    renderWelcome();

    document.getElementById('btn-logout').addEventListener('click', async () => {
        await sb.auth.signOut();
        window.location.href = 'login.html';
    });

    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('open');
    });
}

// ── Sidebar ───────────────────────────────────────────────────────────────
function renderSidebar() {
    const nav = document.getElementById('sidebar-nav');
    nav.innerHTML = '<p class="sidebar-section-label">Tus packs</p>';

    PACKS.forEach(pack => {
        const accessible = hasAccess(pack.id);
        const btn = document.createElement('button');
        btn.className = 'sidebar-item' + (accessible ? '' : ' locked');
        btn.dataset.packId = pack.id;
        btn.innerHTML = `
            <span class="pack-num">${pack.num}</span>
            <span>${pack.name}</span>
            ${accessible ? '' : '<span class="lock-icon">&#x1F512;</span>'}
        `;
        if (accessible) {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
                btn.classList.add('active');
                renderPack(pack);
                document.getElementById('sidebar').classList.remove('open');
            });
        }
        nav.appendChild(btn);
    });

    if (isAdmin) {
        const sep = document.createElement('p');
        sep.className = 'sidebar-section-label';
        sep.style.marginTop = '16px';
        sep.textContent = 'Admin';
        nav.appendChild(sep);

        const adminBtn = document.createElement('button');
        adminBtn.className = 'sidebar-item';
        adminBtn.id = 'sidebar-admin-btn';
        adminBtn.dataset.packId = '__admin__';
        adminBtn.innerHTML = `
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
            </svg>
            <span>Alumnos</span>`;
        adminBtn.addEventListener('click', () => {
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            adminBtn.classList.add('active');
            renderAdmin();
            document.getElementById('sidebar').classList.remove('open');
        });
        nav.appendChild(adminBtn);
    }
}

// ── Welcome screen ────────────────────────────────────────────────────────
function renderWelcome() {
    const main = document.getElementById('main-content');
    const firstName = (currentUser.name || '').split(' ')[0];

    const cards = PACKS.map(pack => {
        const accessible = hasAccess(pack.id);
        return `
            <div class="welcome-pack-card${accessible ? '' : ' locked-card'}"
                 ${accessible ? `onclick="selectPackById('${pack.id}')"` : ''}>
                <p class="wpc-num">${pack.num}</p>
                <p class="wpc-name">${pack.name}</p>
                <p class="wpc-count">${accessible ? pack.modules.length + ' módulos' : 'Sin acceso'}</p>
            </div>`;
    }).join('');

    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Bienvenido de vuelta</p>
            <h1 class="content-title">${firstName || 'Jugador'}</h1>
            <p class="content-desc">Selecciona un pack para empezar a entrenar.</p>
        </div>
        <div class="welcome-grid">${cards}</div>`;
}

function selectPackById(id) {
    const pack = PACKS.find(p => p.id === id);
    if (!pack) return;
    document.querySelectorAll('.sidebar-item').forEach(el => {
        el.classList.toggle('active', el.dataset.packId === id);
    });
    renderPack(pack);
}

// ── Pack view ─────────────────────────────────────────────────────────────
function renderPack(pack) {
    activePack = pack;
    const main = document.getElementById('main-content');

    if (!hasAccess(pack.id)) {
        main.innerHTML = `
            <div class="content-header">
                <p class="content-eyebrow">Pack ${pack.num}</p>
                <h1 class="content-title">${pack.fullName}</h1>
            </div>
            <div class="locked-panel">
                <svg width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="#555" stroke-width="1.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                </svg>
                <h2>Pack bloqueado</h2>
                <p>No tienes acceso a este pack. Amplía tu suscripción para desbloquearlo.</p>
                <a href="academia.html#lista-espera" class="btn-upgrade">Ver opciones</a>
            </div>`;
        return;
    }

    const moduleItems = pack.modules.map((mod, i) => `
        <div class="module-item" data-index="${i}" onclick="playModule(${i})">
            <span class="module-num">${String(i + 1).padStart(2, '0')}</span>
            <div class="module-info">
                <p class="module-name">${mod.name}</p>
                <p class="module-meta">Módulo ${i + 1} · Pack ${pack.num}</p>
            </div>
            <span class="module-duration">${mod.duration}</span>
        </div>`).join('');

    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Pack ${pack.num}</p>
            <h1 class="content-title">${pack.fullName}</h1>
            <p class="content-desc">${pack.desc}</p>
        </div>
        <div id="video-area" style="margin-bottom:32px;"></div>
        <div class="module-list">${moduleItems}</div>`;

    renderVideoPlaceholder();
}

function renderVideoPlaceholder() {
    document.getElementById('video-area').innerHTML = `
        <div class="video-player-wrap">
            <div class="video-placeholder">
                <div class="video-placeholder-icon">
                    <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 010 1.972l-11.54 6.347a1.125 1.125 0 01-1.667-.986V5.653z"/>
                    </svg>
                </div>
                Selecciona un módulo para reproducir
            </div>
        </div>`;
}

function playModule(index) {
    if (!activePack) return;
    const mod = activePack.modules[index];
    activeModule = index;

    document.querySelectorAll('.module-item').forEach((el, i) => {
        el.classList.toggle('playing', i === index);
    });

    const videoArea = document.getElementById('video-area');
    if (mod.videoId) {
        videoArea.innerHTML = `
            <div class="video-player-wrap">
                <iframe src="https://www.youtube.com/embed/${mod.videoId}?autoplay=1&rel=0"
                    allow="autoplay; fullscreen" allowfullscreen></iframe>
            </div>
            <p style="font-size:12px;color:var(--muted);margin-bottom:24px;">${mod.name} · ${mod.duration}</p>`;
    } else {
        videoArea.innerHTML = `
            <div class="video-player-wrap">
                <div class="video-placeholder">
                    <div class="video-placeholder-icon">
                        <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 010 1.972l-11.54 6.347a1.125 1.125 0 01-1.667-.986V5.653z"/>
                        </svg>
                    </div>
                    <span>${mod.name}</span>
                    <span style="font-size:10px;letter-spacing:1px;text-transform:uppercase;color:#2a2a2a;margin-top:4px;">Disponible pronto</span>
                </div>
            </div>
            <p style="font-size:12px;color:var(--muted);margin-bottom:24px;">${mod.name} · ${mod.duration}</p>`;
    }
}

// ── ADMIN ─────────────────────────────────────────────────────────────────
async function adminToken() {
    const { data: { session } } = await sb.auth.getSession();
    return session?.access_token;
}

function formatExpiry(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const diff = Math.round((d - Date.now()) / 86400000);
    if (diff < 0)   return `Expiró hace ${Math.abs(diff)}d`;
    if (diff === 0) return 'Expira hoy';
    if (diff === 1) return 'Mañana';
    if (diff <= 30) return `${diff} días`;
    return d.toLocaleDateString('es', { day:'numeric', month:'short', year:'2-digit' });
}

function expiryStatus(dateStr) {
    if (!dateStr) return 'expired';
    const diff = Math.round((new Date(dateStr) - Date.now()) / 86400000);
    if (diff < 0)   return 'expired';
    if (diff <= 30) return 'expiring';
    return 'valid';
}

async function renderAdmin(refresh = false) {
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Alumnos</h1>
        </div>
        <p style="color:var(--muted);font-size:13px;padding:20px 0;">Cargando...</p>`;

    if (refresh) adminCache = null;
    if (!adminCache) {
        const token = await adminToken();
        const r = await fetch('/api/admin-data', { headers: { 'Authorization': `Bearer ${token}` } });
        if (!r.ok) {
            main.querySelector('p').textContent = 'Error al cargar. Recarga la página.';
            return;
        }
        adminCache = await r.json();
    }
    renderAdminPanel(adminCache.users);
}

function renderAdminPanel(users) {
    const main = document.getElementById('main-content');
    main.innerHTML = `
        <div class="content-header">
            <p class="content-eyebrow">Administración</p>
            <h1 class="content-title">Alumnos</h1>
            <p class="content-desc">${users.length} registrados &middot; ${users.filter(u => u.confirmed).length} confirmados</p>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap;">
            <input class="admin-search" id="admin-search" placeholder="Buscar por nombre o email..." oninput="filterAdminUsers(this.value)">
            <button class="admin-refresh-btn" onclick="renderAdmin(true)">Actualizar</button>
        </div>
        <div id="admin-users-list">${buildUserList(users)}</div>`;
}

function buildUserList(users) {
    if (!users.length) return '<p style="color:var(--muted);font-size:13px;">Sin usuarios.</p>';
    return users.map(u => {
        const packTags = u.packs.length
            ? u.packs.map(p => `
                <span class="pack-tag ${expiryStatus(p.expires_at)}">
                    <span class="pack-tag-name">${p.pack}</span>
                    <span class="pack-tag-expiry">${formatExpiry(p.expires_at)}</span>
                    <button class="pack-revoke" onclick="revokePack('${u.id}','${p.pack}',this)" title="Revocar">&times;</button>
                </span>`).join('')
            : '<span class="no-packs-label">Sin acceso</span>';

        return `<div class="user-row" id="urow-${u.id}">
            <div class="user-row-top">
                <div>
                    <p class="user-info-name">${u.name || '—'}</p>
                    <p class="user-info-email">${u.email}</p>
                    <div class="user-badges">
                        <span class="badge ${u.confirmed ? 'badge-ok' : 'badge-pending'}">${u.confirmed ? 'Confirmado' : 'Sin confirmar'}</span>
                        ${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''}
                    </div>
                </div>
            </div>
            <div class="user-packs-row" id="ptags-${u.id}">${packTags}</div>
            <div class="assign-row">
                <select class="assign-select" id="sel-${u.id}">
                    <option value="">— Pack a asignar —</option>
                    <option value="tiro">Pack Tiro</option>
                    <option value="footwork">Pack Footwork</option>
                    <option value="defensa">Pack Defensa</option>
                    <option value="fisico">Pack Físico</option>
                    <option value="mental">Pack Mental</option>
                    <option value="completo">Pack Completo</option>
                    <option value="all">Acceso Total</option>
                </select>
                <button class="btn-assign" onclick="assignPack('${u.id}',this)">Asignar 1 año</button>
                <span class="assign-msg" id="msg-${u.id}"></span>
            </div>
        </div>`;
    }).join('');
}

function filterAdminUsers(q) {
    if (!adminCache) return;
    const lq = q.toLowerCase();
    const filtered = lq
        ? adminCache.users.filter(u => u.email.toLowerCase().includes(lq) || (u.name || '').toLowerCase().includes(lq))
        : adminCache.users;
    document.getElementById('admin-users-list').innerHTML = buildUserList(filtered);
}

function showMsg(userId, type, text) {
    const el = document.getElementById(`msg-${userId}`);
    if (!el) return;
    el.className = `assign-msg ${type}`;
    el.textContent = text;
    if (type === 'ok') setTimeout(() => { el.className = 'assign-msg'; el.textContent = ''; }, 4000);
}

async function assignPack(userId, btn) {
    const sel = document.getElementById(`sel-${userId}`);
    const pack = sel.value;
    if (!pack) return;
    btn.disabled = true;
    btn.textContent = '...';

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'assign', userId, pack })
    });
    const data = await r.json();
    btn.disabled = false;
    btn.textContent = 'Asignar 1 año';

    if (data.success) {
        showMsg(userId, 'ok', data.message || 'Pack asignado');
        adminCache = null;
        setTimeout(async () => {
            await renderAdmin();
            document.getElementById(`urow-${userId}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 800);
    } else {
        showMsg(userId, 'err', data.error || 'Error al asignar');
    }
}

async function revokePack(userId, pack, btn) {
    btn.disabled = true;

    const token = await adminToken();
    const r = await fetch('/api/admin-action', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ action: 'revoke', userId, pack })
    });
    const data = await r.json();
    if (data.success) {
        showMsg(userId, 'ok', `Pack "${pack}" revocado`);
        adminCache = null;
        setTimeout(async () => { await renderAdmin(); }, 800);
    } else {
        btn.disabled = false;
        showMsg(userId, 'err', data.error || 'Error al revocar');
    }
}

// ── Start ─────────────────────────────────────────────────────────────────
checkAuth();
</script>
